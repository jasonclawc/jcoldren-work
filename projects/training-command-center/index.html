<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client · Training OS</title>
<!-- CDN libraries — no local files needed -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script>
/* ── Runs synchronously right after Babel loads, before DOMContentLoaded ──
   Intercepts Babel.transform so any JSX parse error shows on-screen.
   Also catches any JS runtime error before React is ready. */
window.__errorLog = [];
window.onerror = function(msg, src, line, col, err) {
  window.__errorLog.push({type:'onerror', msg:msg, src:src, line:line, col:col, stack:err&&err.stack});
  document.title = 'ERR[onerror]: ' + msg + ' @ ' + src + ':' + line;
  var d = document.getElementById('root');
  if (!d) return false;
  d.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#050B17;color:#fff;padding:32px;font-family:sans-serif;text-align:center;';
  d.innerHTML = '<div style="font-size:40px;margin-bottom:14px">🔴</div>'
    + '<div style="font-size:20px;font-weight:900;color:#FF6B35;margin-bottom:12px">JAVASCRIPT ERROR</div>'
    + '<div style="font-size:11px;color:rgba(255,255,255,.55);max-width:640px;background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.25);border-radius:10px;padding:14px;text-align:left;white-space:pre-wrap;word-break:break-all;font-family:monospace;line-height:1.7">'
    + 'Message: ' + msg + '\nSource: ' + src + '\nLine: ' + line + ', Col: ' + col + (err ? '\n\nStack:\n' + err.stack : '\n\n(No stack — cross-origin or inline script error)') + '</div>'
    + '<div style="margin-top:16px;font-size:11px;color:rgba(255,255,255,.3)">Screenshot this and send to your coordinator.</div>';
  return true;
};
window.addEventListener('unhandledrejection', function(e) {
  window.__errorLog.push({type:'promise', reason:String(e.reason)});
  document.title = 'ERR[promise]: ' + String(e.reason);
  window._showPortalError('ASYNC ERROR', String((e.reason&&e.reason.stack)||e.reason));
});
window._showPortalError = function(title, detail) {
  var d = document.getElementById('root');
  if (!d) return;
  d.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#050B17;color:#fff;padding:32px;font-family:sans-serif;text-align:center;';
  d.innerHTML = '<div style="font-size:40px;margin-bottom:14px">🔴</div>'
    + '<div style="font-size:20px;font-weight:900;color:#FF6B35;margin-bottom:12px">' + title + '</div>'
    + '<div style="font-size:11px;color:rgba(255,255,255,.55);max-width:640px;background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.25);border-radius:10px;padding:14px;text-align:left;white-space:pre-wrap;word-break:break-all;font-family:monospace;line-height:1.7">' + String(detail) + '</div>'
    + '<div style="margin-top:16px;font-size:11px;color:rgba(255,255,255,.3)">Screenshot this and send to your coordinator.</div>';
};

/* ── DOM-level interception ──────────────────────────────────────────────────
   Babel standalone calls its INTERNAL transform() (not the public Babel.transform),
   then appends a new <script> element to the document. We intercept appendChild /
   insertBefore to wrap that script's text in try/catch BEFORE it executes.
   This is the only reliable way to catch runtime errors from Babel-compiled code.
   ─────────────────────────────────────────────────────────────────────────── */
(function() {
  var CATCH_SUFFIX = '\n}catch(__portalErr){'
    + 'console.error("Portal runtime error:",__portalErr);'
    + 'window._showPortalError("RUNTIME ERROR",(__portalErr&&__portalErr.stack)||(__portalErr&&__portalErr.message)||String(__portalErr));'
    + '}';

  function wrapScript(node) {
    if (node && node.tagName === 'SCRIPT' && !node.src && !node.__wrapped) {
      var t = node.text || node.textContent || '';
      if (t.length > 1000) { /* only wrap substantial scripts — our app is 200k+ chars */
        node.text = 'try{\n' + t + CATCH_SUFFIX;
        node.__wrapped = true;
      }
    }
    return node;
  }

  var _ab = Node.prototype.appendChild;
  Node.prototype.appendChild = function(n) { return _ab.call(this, wrapScript(n)); };

  var _ib = Node.prototype.insertBefore;
  Node.prototype.insertBefore = function(n, ref) { return _ib.call(this, wrapScript(n), ref); };
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Check that all libraries loaded; if not, show setup instructions */
window.addEventListener('load', function(){
  var missing=[];
  if(typeof React==='undefined')   missing.push('react.min.js');
  if(typeof ReactDOM==='undefined') missing.push('react-dom.min.js');
  if(typeof Babel==='undefined')    missing.push('babel.min.js');
  if(typeof XLSX==='undefined')     missing.push('xlsx.full.min.js');
  if(!missing.length) return; /* everything loaded — app is running */

  var d=document.getElementById('root');
  if(!d) return;
  d.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#050B17;color:#fff;padding:32px;font-family:sans-serif;text-align:center;';
  d.innerHTML=''
    +'<div style="font-size:44px;margin-bottom:16px">⚙️</div>'
    +'<div style="font-size:24px;font-weight:900;color:#FFB800;margin-bottom:6px;letter-spacing:1px">ONE-TIME SETUP REQUIRED</div>'
    +'<div style="font-size:13px;color:rgba(255,255,255,.5);margin-bottom:24px;max-width:520px;line-height:1.6">The portal needs 4 small library files saved in the <strong style="color:#fff">libs/</strong> folder next to index.html. These files are missing or couldn\'t be read:</div>'
    +'<div style="background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.2);border-radius:8px;padding:10px 18px;font-size:12px;color:#FF9090;margin-bottom:24px">Missing: '+missing.join(', ')+'</div>'
    +'<div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px 24px;max-width:620px;text-align:left;width:100%">'
    +'<div style="font-size:11px;font-weight:800;color:#FFB800;letter-spacing:.8px;margin-bottom:14px;text-transform:uppercase">📥 Download &amp; save each file to your <code style="background:rgba(255,184,0,.12);padding:2px 6px;border-radius:4px">libs/</code> folder:</div>'
    +'<div style="font-size:12px;line-height:2.4;color:rgba(255,255,255,.75)">'
    +'<div>① <a href="https://unpkg.com/react@18/umd/react.production.min.js" download="react.min.js" style="color:#1493FF;font-weight:700">react.min.js</a>&nbsp;&nbsp;<span style="color:rgba(255,255,255,.35);font-size:10px">(~11 KB)</span></div>'
    +'<div>② <a href="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" download="react-dom.min.js" style="color:#1493FF;font-weight:700">react-dom.min.js</a>&nbsp;&nbsp;<span style="color:rgba(255,255,255,.35);font-size:10px">(~130 KB)</span></div>'
    +'<div>③ <a href="https://unpkg.com/@babel/standalone/babel.min.js" download="babel.min.js" style="color:#1493FF;font-weight:700">babel.min.js</a>&nbsp;&nbsp;<span style="color:rgba(255,255,255,.35);font-size:10px">(~3 MB — takes a moment)</span></div>'
    +'<div>④ <a href="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" download="xlsx.full.min.js" style="color:#1493FF;font-weight:700">xlsx.full.min.js</a>&nbsp;&nbsp;<span style="color:rgba(255,255,255,.35);font-size:10px">(~860 KB)</span></div>'
    +'</div>'
    +'<div style="margin-top:14px;font-size:11px;color:rgba(255,255,255,.3);line-height:1.7">Click each link → browser will download the file → move it into the <strong>libs/</strong> folder → reload this page.</div>'
    +'</div>'
    +'<button onclick="location.reload()" style="margin-top:20px;background:rgba(20,147,255,.15);border:1px solid rgba(20,147,255,.4);border-radius:9px;color:#1493FF;padding:10px 28px;cursor:pointer;font-size:13px;font-weight:700">↺ Reload After Downloading</button>';
});
</script>
<style>
:root {
  --fd-blue:#1493FF; --fd-blue-dk:#0070D4; --fd-blue-dim:rgba(20,147,255,.13);
  --fd-blue-glow:rgba(20,147,255,.32); --fd-green:#84B500; --fd-green-dim:rgba(132,181,0,.13);
  --fd-yellow:#FFB800; --fd-yellow-dk:#D49B00; --fd-yellow-glow:rgba(255,184,0,.35);
  --navy:#050B17; --navy2:#081220; --navy3:#0B1830; --navy4:#0F2040;
  --card:rgba(255,255,255,.055); --card-h:rgba(255,255,255,.095);
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.16);
  --t1:#FFF; --t2:rgba(255,255,255,.62); --t3:rgba(255,255,255,.36);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--t1);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}

/* ── Ambient ── */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ab{position:absolute;border-radius:50%;filter:blur(110px)}
.ab1{width:700px;height:700px;background:var(--fd-blue);opacity:.16;top:-250px;left:-200px;animation:b1 22s ease-in-out infinite alternate}
.ab2{width:500px;height:500px;background:#0A1E6A;opacity:.22;bottom:-150px;right:-100px;animation:b2 28s ease-in-out infinite alternate}
.ab3{width:300px;height:300px;background:var(--fd-yellow);opacity:.05;top:35%;left:40%;animation:b3 18s ease-in-out infinite alternate}
@keyframes b1{to{transform:translate(80px,60px)scale(1.1)}}
@keyframes b2{to{transform:translate(-60px,-40px)scale(1.15)}}
@keyframes b3{to{transform:translate(30px,-20px)scale(.9)}}
.scn{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.035) 3px,rgba(0,0,0,.035) 4px)}

/* ── Top bar ── */
.tb{position:fixed;top:0;left:0;right:0;height:46px;z-index:200;display:flex;align-items:center;padding:0 14px;gap:10px;background:linear-gradient(180deg,rgba(0,60,180,.98) 0%,rgba(5,11,23,.97) 100%);backdrop-filter:blur(20px);border-bottom:1px solid rgba(20,147,255,.25)}
.tb::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--fd-yellow) 25%,var(--fd-blue) 60%,transparent);opacity:.7;animation:tbl 5s ease-in-out infinite alternate}
@keyframes tbl{from{opacity:.45}to{opacity:.9}}
.fd-mark{width:30px;height:34px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.fd-mark svg{width:100%;height:100%}
.fd-wm{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;letter-spacing:.8px;text-transform:uppercase}
.fd-prod{font-size:10px;font-weight:800;color:var(--fd-yellow);padding:3px 9px;border-radius:5px;background:rgba(255,184,0,.12);border:1px solid rgba(255,184,0,.3);letter-spacing:.5px;text-transform:uppercase}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.live-bdg{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;background:rgba(255,184,0,.15);border:1px solid rgba(255,184,0,.4);font-size:10px;font-weight:800;color:var(--fd-yellow);letter-spacing:.8px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--fd-yellow);animation:lp 1.6s ease-in-out infinite}
@keyframes lp{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,184,0,.6)}50%{opacity:.7;box-shadow:0 0 0 5px rgba(255,184,0,0)}}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-ic{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;color:var(--t3);font-size:13px;position:relative}
.tb-ic:hover{background:rgba(255,255,255,.1);color:#fff}
.nb-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#FF6B35;box-shadow:0 0 6px rgba(255,107,53,.8)}
.tb-time{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--t3);letter-spacing:.5px}
.wave-chip{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:5px;background:linear-gradient(90deg,var(--fd-yellow-dk),var(--fd-yellow));color:#0A1428}

/* User avatar in topbar */
.tb-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;cursor:pointer;border:2px solid rgba(20,147,255,.4);transition:all .2s;flex-shrink:0}
.tb-avatar:hover{border-color:var(--fd-blue);box-shadow:0 0 10px var(--fd-blue-glow)}

/* ── Sidebar ── */
.sb{position:fixed;left:0;top:46px;bottom:24px;width:60px;z-index:150;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;background:rgba(3,8,20,.88);backdrop-filter:blur(16px);border-right:1px solid rgba(255,255,255,.07)}
.ni{width:44px;height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:3px;transition:all .2s;color:var(--t3);position:relative;font-size:8.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.ni:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.ni.act{background:rgba(255,184,0,.1);color:var(--fd-yellow);border:1px solid rgba(255,184,0,.25)}
.ni.act::before{content:'';position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--fd-yellow)}
.ni-ic{font-size:17px;line-height:1}
.n-sep{width:28px;height:1px;background:var(--border);margin:4px 0}

/* ── Main ── */
.main{position:fixed;left:60px;top:46px;right:0;bottom:24px;overflow-y:auto;padding:20px;z-index:10}

/* ── Status bar ── */
.sbar{position:fixed;left:0;right:0;bottom:0;height:24px;z-index:300;display:flex;align-items:center;padding:0 12px;gap:14px;background:rgba(0,10,28,.96);border-top:1px solid rgba(255,184,0,.15);font-size:10px;font-weight:600;color:var(--t3)}
.sb-it{display:flex;align-items:center;gap:5px}
.sb-dot{width:6px;height:6px;border-radius:50%}
.sb-sp{width:1px;height:12px;background:var(--border)}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);transition:all .2s;backdrop-filter:blur(4px)}
.card-lift:hover{transform:translateY(-2px);box-shadow:0 14px 44px rgba(0,0,0,.45)}
.hero{background:linear-gradient(135deg,#091B42 0%,#0D2458 40%,#112E70 100%);border:1px solid rgba(20,147,255,.25);border-radius:var(--r-lg);position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.hero::before{content:'';position:absolute;top:-80px;right:-80px;width:450px;height:450px;background:radial-gradient(circle,rgba(20,147,255,.18) 0%,transparent 65%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--fd-yellow) 30%,var(--fd-yellow) 70%,transparent);opacity:.6}

/* ── Ring ── */
.ring-w{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-w svg{transform:rotate(-90deg)}
.ring-c{position:absolute;text-align:center}
.ring-n{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:34px;line-height:1}
.ring-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-top:2px}

/* ── Typography ── */
.eyebrow{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--fd-blue);margin-bottom:6px;opacity:.9}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.5px}
.page-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:36px;text-transform:uppercase;letter-spacing:1px;line-height:1}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:-1px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:700;cursor:pointer;border:none;transition:all .18s;white-space:nowrap}
.btn-p{background:var(--fd-yellow);color:#0A1428;padding:9px 18px;font-size:12px;font-weight:800;letter-spacing:.3px}
.btn-p:hover{background:var(--fd-yellow-dk);transform:translateY(-1px);box-shadow:0 6px 22px var(--fd-yellow-glow)}
.btn-g{background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);border:1px solid var(--border);padding:9px 18px;font-size:12px}
.btn-g:hover{background:rgba(255,255,255,.12);color:#fff}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-xs{padding:4px 10px;font-size:10px}

/* ── Pills ── */
.cpill{display:inline-flex;align-items:center;border-radius:4px;padding:2px 6px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}

/* ── Checkbox ── */
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid rgba(255,255,255,.2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px}
.chk.on{background:var(--fd-green);border-color:var(--fd-green)}
.chk.on::after{content:'✓';font-size:10px;color:#fff;font-weight:800}

/* ── Progress bar ── */
.pbar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.pbar-f{height:100%;border-radius:2px;transition:width 1s ease}

/* ── Misc ── */
.brief-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:8px}
.row-sep{border-bottom:1px solid rgba(255,255,255,.04)}
.toggle-t{width:38px;height:20px;border-radius:10px;cursor:pointer;transition:background .2s;position:relative;flex-shrink:0}
.toggle-th{width:14px;height:14px;border-radius:7px;background:#fff;position:absolute;top:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.search-in{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:9px;padding:9px 14px 9px 36px;color:#fff;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:all .2s}
.search-in::placeholder{color:var(--t3)}
.search-in:focus{background:rgba(255,255,255,.08);border-color:rgba(20,147,255,.45)}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .2s ease}
.modal-box{background:var(--navy2);border:1px solid rgba(20,147,255,.2);border-radius:var(--r-lg);padding:26px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 40px 80px rgba(0,0,0,.7)}

/* ── Timeline ── */
.day-blk{border-radius:var(--r-md);background:rgba(255,255,255,.03);border:1px solid var(--border);overflow:hidden}
.day-hdr{padding:11px 16px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sess-row{padding:9px 16px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:background .15s}
.sess-row:last-child{border-bottom:none}
.sess-row:hover{background:rgba(255,255,255,.04)}
.sess-row.open{background:rgba(20,147,255,.07)}
.sess-detail{margin-top:10px;padding:12px;background:rgba(20,147,255,.06);border-radius:8px;font-size:12px;line-height:1.7;color:var(--t2);border-left:2px solid rgba(20,147,255,.4)}
.wtab{padding:8px 18px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.3px;cursor:pointer;transition:all .18s;border:1px solid transparent;color:var(--t3)}
.wtab.act{background:rgba(255,184,0,.12);border-color:rgba(255,184,0,.4);color:var(--fd-yellow)}
.wtab:not(.act):hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}

/* ── Guide card ── */
.guide-card{border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .22s;display:flex;flex-direction:column}
.guide-card:hover{background:var(--card-h);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* ── Quiz ── */
.q-opt{border-radius:8px;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid var(--border);cursor:pointer;transition:all .18s;font-size:13px;font-weight:500}

/* ── Error Boundary (catches React render errors instead of black screen) ── */
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,info){console.error('Portal error:',e,info);}
  render(){
    if(this.state.err){
      return(
        <div style={{position:'fixed',inset:0,background:'#0A1428',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,fontFamily:'Inter,sans-serif',color:'#fff',textAlign:'center'}}>
          <div style={{fontSize:40,marginBottom:16}}>⚠️</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:24,color:'#FF6B35',marginBottom:12}}>PORTAL ERROR</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.5)',maxWidth:500,lineHeight:1.6,background:'rgba(255,80,80,.07)',border:'1px solid rgba(255,80,80,.2)',borderRadius:10,padding:'12px 16px',marginBottom:16,textAlign:'left',fontFamily:'monospace',whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
            {this.state.err.toString()}
          </div>
          <button onClick={()=>window.location.reload()} style={{background:'rgba(20,147,255,.15)',border:'1px solid rgba(20,147,255,.4)',borderRadius:9,color:'#1493FF',padding:'10px 24px',cursor:'pointer',fontSize:13,fontWeight:700}}>
            Reload Portal
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ══════════════════════════════════════════
   WAVE CONFIG
   ─────────────────────────────────────────
   This is the single block a coordinator

══════════════════════════════════════════ */
const WAVE_CONFIG={
  wave:         'Wave 86',           // Short wave name shown in chips & badges
  cohort:       'NJ Wave 86',        // Full cohort label used in schedule header
  location:     'New Jersey',        // Location (NJ, PA, etc.)
  startDate:    '2025-01-05',        // ISO date — learner default start date
  endDate:      '2025-01-21',        // ISO date — end of classroom training
  passing:      80,                  // KC passing threshold (%)
  trainers:     ['Greg','Carlos','Darius','Jason'], // Trainer roster

  classroomLink:'',                  // Class.com room URL — set via Coordinator Mode
};
// ── Wave slug: "Wave 86" → "wave-86" ──
function waveSlug(name){return(name||'wave').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
// ── Determine active wave ID, defaulting to slug of hardcoded config ──
function getActiveWaveId(){try{return localStorage.getItem('fd_active_wave')||waveSlug(WAVE_CONFIG.wave)}catch{return waveSlug(WAVE_CONFIG.wave)}}
// ── Load saved wave config for the active wave ──
(function(){try{
  const id=getActiveWaveId();
  const saved=JSON.parse(localStorage.getItem('fd_waveconfig_'+id)||localStorage.getItem('fd_wave_config'));
  if(saved)Object.assign(WAVE_CONFIG,saved);
}catch(e){}})();

══════════════════════════════════════════ */

  {name:'Agent',  min:500,  max:1499, icon:'⚡', color:'#1493FF', bg:'rgba(20,147,255,.12)', desc:'Building real knowledge'},
  {name:'Pro',    min:1500, max:Infinity, icon:'🏆', color:'#FFB800', bg:'rgba(255,184,0,.12)', desc:'Ready for anything'},
];
const XP_AWARDS={
  session:        {xp:10,  label:'+10 XP — Session completed'},
  kcFail:         {xp:20,  label:'+20 XP — KC attempted'},
  kcPass:         {xp:100, label:'+100 XP — Knowledge Check passed!'},
  kcPassFirst:    {xp:150, label:'+150 XP — Passed on first attempt!'},
};
function getLevel(xp){ return LEVELS.find(l=>xp>=l.min&&xp<=l.max)||LEVELS[0]; }
function xpToNext(xp){
  const lv=getLevel(xp);
  if(lv.max===Infinity)return null;
  return {needed:lv.max+1-xp,total:lv.max+1-lv.min,pct:Math.round(((xp-lv.min)/(lv.max+1-lv.min))*100)};
}

function isKCUnlocked(topic,checked){
  const keywords=KC_UNLOCK[topic];
  if(!keywords||keywords.length===0)return true;
  for(let wi=0;wi<WEEKS.length;wi++){
    const days=WEEKS[wi].days;
    for(let di=0;di<days.length;di++){
      const sessions=days[di].sessions;
      for(let si=0;si<sessions.length;si++){
        const s=sessions[si];
        if(keywords.some(kw=>s.title.toLowerCase().includes(kw.toLowerCase()))){
          if(checked[`${wi}-${di}-${si}`])return true;
        }
      }
    }
  }
  return false;
}

/* ══════════════════════════════════════════
   SHAREPOINT SYNC  —  central stats tracking
   ──────────────────────────────────────────
   HOW IT WORKS:
   When this app is hosted inside SharePoint, agents' stats are
   automatically synced to a SharePoint List using their existing
   Microsoft session — no login prompt, no extra setup for agents.

   COORDINATOR SETUP (one-time):
   1. Go to your training SharePoint site
   2. Click + New → List → name it "AgentStats"
   3. Add these columns (exact names matter):
        AgentEmail  → Single line of text
        Wave        → Single line of text
        XP          → Number
        QuizScores  → Multiple lines of text
        ModulesDone → Number
        LastActive  → Single line of text
   4. Paste your SharePoint site URL below (no trailing slash)
      Example: https://client.sharepoint.example/sites/CXOTraining
   5. Upload this file + the libs/ folder to a document library
      on that same SharePoint site and share the link with agents.
══════════════════════════════════════════ */
const SP_CONFIG = {
  // ↓ Paste your SharePoint site URL here (no trailing slash)
  siteUrl: 'https://example.sharepoint.com/sites/CustomerOperationsTraining',
  // ↓ Leave as-is unless you named your list something different
  listName: 'AgentStats',
};

/* Internal sync helpers — do not edit below this line */
const _sp = {
  // True only when hosted on SharePoint (not local file / other host)
  isActive() {
    return SP_CONFIG.siteUrl.length > 0
      && window.location.hostname.includes('sharepoint.com');
  },

  // Fetch the SharePoint form digest (CSRF token required for writes)
  async getDigest() {
    const r = await fetch(SP_CONFIG.siteUrl + '/_api/contextinfo', {
      method: 'POST',
      headers: { Accept: 'application/json;odata=nometadata' },
      credentials: 'include',
    });
    const d = await r.json();
    return d.FormDigestValue;
  },

  // Find existing row for this agent+wave combo
  async findRow(email, wave) {
    const enc = encodeURIComponent(`AgentEmail eq '${email}' and Wave eq '${wave}'`);
    const r = await fetch(
      `${SP_CONFIG.siteUrl}/_api/web/lists/getbytitle('${SP_CONFIG.listName}')/items?$filter=${enc}&$select=Id`,
      { headers: { Accept: 'application/json;odata=nometadata' }, credentials: 'include' }
    );
    const d = await r.json();
    return d.value && d.value.length > 0 ? d.value[0].Id : null;
  },

  // Create a new row
  async createRow(digest, payload) {
    await fetch(
      `${SP_CONFIG.siteUrl}/_api/web/lists/getbytitle('${SP_CONFIG.listName}')/items`,
      {
        method: 'POST',
        credentials: 'include',
        headers: {
          Accept: 'application/json;odata=nometadata',
          'Content-Type': 'application/json;odata=nometadata',
          'X-RequestDigest': digest,
        },
        body: JSON.stringify(payload),
      }
    );
  },

  // Update an existing row
  async updateRow(digest, rowId, payload) {
    await fetch(
      `${SP_CONFIG.siteUrl}/_api/web/lists/getbytitle('${SP_CONFIG.listName}')/items(${rowId})`,
      {
        method: 'POST',
        credentials: 'include',
        headers: {
          Accept: 'application/json;odata=nometadata',
          'Content-Type': 'application/json;odata=nometadata',
          'X-RequestDigest': digest,
          'X-HTTP-Method': 'MERGE',
          'IF-MATCH': '*',
        },
        body: JSON.stringify(payload),
      }
    );
  },
};

// Main sync function — call this after any stat change.
// Fire-and-forget: never blocks the UI, silently skips if not on SharePoint.
function syncToSharePoint() {
  if (!_sp.isActive()) return;
  // Debounce: wait 2s after last change before writing
  clearTimeout(window._spSyncTimer);
  window._spSyncTimer = setTimeout(async () => {
    try {
      const profile = loadProfile();
      if (!profile || !profile.email) return; // no profile yet, skip
      const email = profile.email.toLowerCase().trim();
      const wave = getActiveWaveId();
      const xp = loadXP();
      const kc = loadKC();
      const checked = loadChecked();
      const modulesDone = Object.keys(checked).length;
      const quizScores = JSON.stringify(
        Object.fromEntries(
          Object.entries(kc).map(([k, v]) => [k, { passed: v.passed, pct: v.pct || 0 }])
        )
      );
      const payload = {
        Title: profile.name,
        AgentEmail: email,
        Wave: wave,
        XP: xp,
        QuizScores: quizScores,
        ModulesDone: modulesDone,
        LastActive: new Date().toISOString(),
      };
      const digest = await _sp.getDigest();
      const existingId = await _sp.findRow(email, wave);
      if (existingId) {
        await _sp.updateRow(digest, existingId, payload);
      } else {
        await _sp.createRow(digest, payload);
      }
    } catch (e) {
      // Sync failure is silent — app keeps working via localStorage
      console.warn('[SP Sync] Could not sync to SharePoint:', e.message);
    }
  }, 2000);
}

/* ══════════════════════════════════════════
   STORAGE  —  wave-namespaced
   All learner data is scoped to the active wave so multiple
   waves can coexist in localStorage without overwriting each other.
   Key pattern:  fd_{waveId}_{suffix}
══════════════════════════════════════════ */
const LS_COORD_PIN   = 'fd_coord_pin';
const LS_WAVE_ACTIVE = 'fd_active_wave';
const LS_WAVE_REG    = 'fd_wave_registry';

// Returns a localStorage key scoped to the active wave
function wk(suffix){return'fd_'+getActiveWaveId()+'_'+suffix;}

// Coordinator PIN
function loadCoordPin(){try{return localStorage.getItem(LS_COORD_PIN)||'8686'}catch{return'8686'}}
function saveCoordPin(p){localStorage.setItem(LS_COORD_PIN,p)}

// Wave registry — ordered list of all waves ever activated
function loadWaveRegistry(){try{return JSON.parse(localStorage.getItem(LS_WAVE_REG))||[]}catch{return[]}}
function saveWaveRegistry(r){localStorage.setItem(LS_WAVE_REG,JSON.stringify(r))}
function registerWave(cfg){
  const id=waveSlug(cfg.wave);
  const reg=loadWaveRegistry();
  const idx=reg.findIndex(w=>w.id===id);
  const entry={id,wave:cfg.wave,cohort:cfg.cohort,location:cfg.location,startDate:cfg.startDate,endDate:cfg.endDate,activatedAt:new Date().toISOString()};
  if(idx>=0)reg[idx]=entry; else reg.push(entry);
  saveWaveRegistry(reg);
}

// Save wave config — scoped to that wave's ID
function saveWaveConfig(cfg){
  const id=waveSlug(cfg.wave);
  localStorage.setItem('fd_waveconfig_'+id,JSON.stringify(cfg));
  localStorage.setItem(LS_WAVE_ACTIVE,id);
  if(cfg.classroomLink)localStorage.setItem('fd_'+id+'_class_url',cfg.classroomLink);
  // legacy compat key
  localStorage.setItem('fd_wave_config',JSON.stringify(cfg));
}

// Activate a different wave (for coordinators switching context)
function switchToWave(id){localStorage.setItem(LS_WAVE_ACTIVE,id);window.location.reload();}

// Learner data — all wave-scoped
function loadXP(){try{return parseInt(localStorage.getItem(wk('xp')))||0}catch{return 0}}
function saveXP(x){localStorage.setItem(wk('xp'),String(x));syncToSharePoint();}
function loadNotes(){try{return localStorage.getItem(wk('notes'))||''}catch{return''}}
function saveNotes(n){localStorage.setItem(wk('notes'),n)}
function loadProfile(){try{return JSON.parse(localStorage.getItem(wk('profile')))||null}catch{return null}}
function saveProfile(p){localStorage.setItem(wk('profile'),JSON.stringify(p));syncToSharePoint();}
function loadChecked(){try{return JSON.parse(localStorage.getItem(wk('checked')))||{}}catch{return{}}}
function saveChecked(c){localStorage.setItem(wk('checked'),JSON.stringify(c));syncToSharePoint();}
function loadKC(){try{return JSON.parse(localStorage.getItem(wk('kc')))||{}}catch{return{}}}
function saveKC(k){localStorage.setItem(wk('kc'),JSON.stringify(k));syncToSharePoint();}

// Buddy Schedule — the on-desk pairing grid from WFM
function loadBuddySchedule(){try{const s=JSON.parse(localStorage.getItem(wk('buddy_sched')));return s&&s.dates&&s.rows?s:null}catch{return null}}
function saveBuddySchedule(s){localStorage.setItem(wk('buddy_sched'),JSON.stringify(s))}

// Schedule — wave-scoped override of the hardcoded WEEKS array
function loadSchedule(){try{const s=JSON.parse(localStorage.getItem(wk('schedule')));return Array.isArray(s)&&s.length?s:null}catch{return null}}
function saveSchedule(weeks){localStorage.setItem(wk('schedule'),JSON.stringify(weeks))}

// Wave stats helper — reads summary data for any wave ID
function getWaveStats(id){
  try{
    const profile=JSON.parse(localStorage.getItem('fd_'+id+'_profile'));
    const checked=JSON.parse(localStorage.getItem('fd_'+id+'_checked'))||{};
    const kc=JSON.parse(localStorage.getItem('fd_'+id+'_kc'))||{};
    const xp=parseInt(localStorage.getItem('fd_'+id+'_xp'))||0;
    const kcPassed=Object.values(kc).filter(r=>r.passed).length;
    return{hasData:!!profile,name:profile?.name||null,xp,sessions:Object.keys(checked).length,kcPassed};
  }catch{return{hasData:false,xp:0,sessions:0,kcPassed:0}}
}

function Chk({on,toggle}){
  return <div className={`chk${on?' on':''}`} onClick={e=>{e.stopPropagation();toggle()}} />;
}
function PBar({pct=0,color='var(--fd-blue)',h=4}){
  return <div className="pbar" style={{height:h}}><div className="pbar-f" style={{width:`${pct}%`,background:color}} /></div>;
}
function useCount(target,dur=1500,delay=0){
  const [v,setV]=useState(0);
  useEffect(()=>{
    const id=setTimeout(()=>{
      const s=Date.now();
      const tick=()=>{const p=Math.min((Date.now()-s)/dur,1);const e=1-Math.pow(1-p,3);setV(Math.round(e*target));if(p<1)requestAnimationFrame(tick)};
      requestAnimationFrame(tick);
    },delay);
    return()=>clearTimeout(id);
  },[target]);
  return v;
}
function initials(name=''){return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()||'??'}
function avatarColor(name=''){const cols=['#1493FF','#84B500','#A78BFA','#F59E0B','#EC4899','#06B6D4','#FF6B35','#10B981'];return cols[name.charCodeAt(0)%cols.length]}
function daysSince(dateStr){
  if(!dateStr)return 0;
  const diff=Date.now()-new Date(dateStr).getTime();
  return Math.max(0,Math.floor(diff/(1000*60*60*24)));
}

/* ══════════════════════════════════════════
   WAVE SWITCHER  —  lets returning learners access a previous wave
══════════════════════════════════════════ */
function WaveSwitcher(){
  const registry=loadWaveRegistry();
  const activeId=getActiveWaveId();
  const prev=registry.filter(w=>w.id!==activeId&&getWaveStats(w.id).hasData);
  if(prev.length===0)return null;

function Ring({pct,size=160}){
  const r=size*.44,circ=2*Math.PI*r,off=circ-(pct/100)*circ;
  const disp=useCount(pct,1900,400);
  return(
    <div className="ring-w ring-glow" style={{width:size,height:size}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <defs><linearGradient id="rg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#1493FF"/><stop offset="100%" stopColor="#84B500"/></linearGradient></defs>
        <circle fill="none" stroke="rgba(255,255,255,.07)" strokeWidth={10} cx={size/2} cy={size/2} r={r}/>
        <circle fill="none" stroke="url(#rg2)" strokeWidth={10} strokeLinecap="round" cx={size/2} cy={size/2} r={r}
          strokeDasharray={circ} strokeDashoffset={off} style={{transition:'stroke-dashoffset 1.8s cubic-bezier(0.4,0,0.2,1)'}}/>
      </svg>
      <div className="ring-c"><div className="ring-n">{disp}<span style={{fontSize:18}}>%</span></div><div className="ring-l">My Progress</div></div>
    </div>
  );
}

function ScheduleEditor({onClose}){
  const [sched,setSched]=useState(()=>JSON.parse(JSON.stringify(WEEKS)));
  const [expandW,setExpandW]=useState({0:true});
  const [expandD,setExpandD]=useState({});
  const [editW,setEditW]=useState(null);   // wi
  const [editD,setEditD]=useState(null);   // 'wi-di'
  const [editS,setEditS]=useState(null);   // 'wi-di-si'
  const [saved,setSaved]=useState(false);
  const [resetConfirm,setResetConfirm]=useState(false);

  // ── Immer-style helpers ──
  const upd=fn=>{setSched(p=>{const n=JSON.parse(JSON.stringify(p));fn(n);return n;});};

  const setWF=(wi,k,v)=>upd(s=>{s[wi][k]=v});
  const setDF=(wi,di,k,v)=>upd(s=>{s[wi].days[di][k]=v});
  const setSF=(wi,di,si,k,v)=>upd(s=>{s[wi].days[di].sessions[si][k]=v});

  const addWeek=()=>upd(s=>{s.push({label:'New Week',sub:'',theme:'',done:false,buddy:false,days:[]});});
  const delWeek=wi=>upd(s=>{s.splice(wi,1)});
  const moveWeek=(wi,dir)=>upd(s=>{const nw=wi+dir;if(nw<0||nw>=s.length)return;[s[wi],s[nw]]=[s[nw],s[wi]];});

  const addDay=wi=>upd(s=>{s[wi].days.push({date:'',trainers:[],sessions:[]});});
  const delDay=(wi,di)=>upd(s=>{s[wi].days.splice(di,1)});
  const moveDay=(wi,di,dir)=>upd(s=>{const nd=di+dir;const days=s[wi].days;if(nd<0||nd>=days.length)return;[days[di],days[nd]]=[days[nd],days[di]];});

  const addSession=(wi,di)=>upd(s=>{s[wi].days[di].sessions.push({t:'',title:'New Session',who:'',cat:'onboard',dur:'',info:''});});
  const delSession=(wi,di,si)=>upd(s=>{s[wi].days[di].sessions.splice(si,1)});
  const moveSession=(wi,di,si,dir)=>upd(s=>{const ns=si+dir;const sess=s[wi].days[di].sessions;if(ns<0||ns>=sess.length)return;[sess[si],sess[ns]]=[sess[ns],sess[si]];});

  const save=()=>{saveSchedule(sched);WEEKS.splice(0,WEEKS.length,...sched);setSaved(true);setTimeout(()=>window.location.reload(),1500);};
  const resetToDefault=()=>{localStorage.removeItem(wk('schedule'));window.location.reload();};

  const inp=(extra={})=>({background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.14)',borderRadius:6,padding:'5px 8px',color:'#fff',fontSize:12,fontFamily:'Inter,sans-serif',outline:'none',...extra});

  return(
    <div style={{position:'fixed',inset:0,zIndex:960,background:'rgba(2,5,14,.98)',backdropFilter:'blur(20px)',overflowY:'auto',fontFamily:'Inter,sans-serif'}}>
      {/* Header */}

        <div style={{width:36,height:36,borderRadius:10,background:'rgba(20,147,255,.15)',border:'1px solid rgba(20,147,255,.3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>📅</div>
        <div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:21,letterSpacing:1.2,color:'var(--fd-blue)'}}>SCHEDULE EDITOR</div>
          <div style={{fontSize:10,color:'rgba(255,255,255,.35)',letterSpacing:.8}}>{sched.length} weeks · {sched.reduce((a,w)=>a+w.days.length,0)} days · {sched.reduce((a,w)=>a+w.days.reduce((b,d)=>b+d.sessions.length,0),0)} sessions</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:8}}>

            <button onClick={()=>setResetConfirm(true)} style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:8,color:'rgba(255,255,255,.35)',padding:'8px 14px',cursor:'pointer',fontSize:11,fontWeight:700}}>Reset to Default</button>
          ):(
            <button onClick={resetToDefault} style={{background:'rgba(255,80,80,.15)',border:'1px solid rgba(255,80,80,.4)',borderRadius:8,color:'#FF7070',padding:'8px 14px',cursor:'pointer',fontSize:11,fontWeight:700}}>Confirm Reset</button>
          )}

            {saved?'✓ Saved — Reloading…':'💾 Save Schedule'}

                                      <button onClick={()=>moveSession(wi,di,si,-1)} disabled={si===0} style={{background:'transparent',border:'1px solid rgba(255,255,255,.07)',borderRadius:3,color:'rgba(255,255,255,.25)',padding:'1px 5px',cursor:si===0?'not-allowed':'pointer',fontSize:10}}>↑</button>
                                      <button onClick={()=>moveSession(wi,di,si,1)} disabled={si===day.sessions.length-1} style={{background:'transparent',border:'1px solid rgba(255,255,255,.07)',borderRadius:3,color:'rgba(255,255,255,.25)',padding:'1px 5px',cursor:si===day.sessions.length-1?'not-allowed':'pointer',fontSize:10}}>↓</button>
                                      <button onClick={()=>{setEditS(sk);setExpandD(p=>({...p,[dk]:true}))}} style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:4,color:'rgba(255,255,255,.4)',padding:'2px 7px',cursor:'pointer',fontSize:10,fontWeight:700}}>✏</button>
                                      <button onClick={()=>delSession(wi,di,si)} style={{background:'rgba(255,80,80,.08)',border:'1px solid rgba(255,80,80,.15)',borderRadius:4,color:'#FF7070',padding:'2px 7px',cursor:'pointer',fontSize:10}}>×</button>
                                    </div>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                          <button onClick={()=>addSession(wi,di)} style={{width:'100%',background:'rgba(20,147,255,.08)',border:'1px dashed rgba(20,147,255,.25)',borderRadius:7,color:'rgba(20,147,255,.6)',padding:'7px',cursor:'pointer',fontSize:11,fontWeight:700,marginTop:4}}>
                            + Add Session
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
                <button onClick={()=>addDay(wi)} style={{width:'100%',background:'rgba(255,255,255,.03)',border:'1px dashed rgba(255,255,255,.15)',borderRadius:8,color:'rgba(255,255,255,.35)',padding:'8px',cursor:'pointer',fontSize:11,fontWeight:700,marginTop:4}}>
                  + Add Day to {week.label}
                </button>
              </div>
            )}
          </div>
        ))}

        <button onClick={addWeek} style={{width:'100%',background:'rgba(255,184,0,.06)',border:'2px dashed rgba(255,184,0,.25)',borderRadius:12,color:'rgba(255,184,0,.6)',padding:'12px',cursor:'pointer',fontSize:13,fontWeight:700,marginTop:8}}>
          + Add Week
        </button>
      </div>
    </div>
  );
}

function learnerStatus(l){
  const pct=Math.round((l.sessions/Math.max(1,l.total))*100);
  if(pct>=100)return 'complete';
  if(pct>=60) return 'on-track';
  if(pct>=30) return 'at-risk';
  return 'behind';
}
function kcPassed(l){return KC_TOPICS.filter(t=>l.kcScores&&(l.kcScores[t]||0)>=KC_PASSING).length;}
function kcTaken(l){return KC_TOPICS.filter(t=>l.kcScores&&l.kcScores[t]!=null).length;}

/* Edit modal — per-learner sessions + per-KC scores */

            </div>

        <div style={{marginBottom:20}}>

function CoordinatorDashboard(){
  const [learners,setLearners]=useState(()=>{
    try{const s=localStorage.getItem('fd_coord_learners');return s?JSON.parse(s):MOCK_LEARNERS;}
    catch{return MOCK_LEARNERS;}
  });
  const [importCode,setImportCode]=useState('');
  const [importMsg,setImportMsg]=useState('');
  const [showImport,setShowImport]=useState(false);
  const [filter,setFilter]=useState('all');
  const [editing,setEditing]=useState(null); // learner being edited

  const saveLearners=next=>{setLearners(next);localStorage.setItem('fd_coord_learners',JSON.stringify(next));};

  const saveLearner=updated=>{
    saveLearners(learners.map(l=>l.id===updated.id?updated:l));
    setEditing(null);
  };

  const resetToDemo=()=>{
    if(!confirm('Reset to demo data? This will clear all saved learner progress.'))return;
    saveLearners(MOCK_LEARNERS);
  };

  const applyImport=()=>{
    try{
      const data=JSON.parse(atob(importCode.trim()));
      if(!data.name||!data.wave){setImportMsg('❌ Invalid code');return;}
      const existing=learners.find(l=>l.name===data.name);
      const updated={
        id:existing?existing.id:'l'+(learners.length+1),
        name:data.name,wave:data.wave,
        startDate:data.startDate||'',
        sessions:data.sessions||0,total:data.total||62,
        kcScores:data.kcScores||{},
        lastActive:'Just now',
      };
      const next=existing?learners.map(l=>l.name===data.name?updated:l):[...learners,updated];
      saveLearners(next);
      setImportMsg('✅ '+data.name+' updated!');
      setImportCode('');
      setTimeout(()=>setImportMsg(''),3500);
    }catch{setImportMsg('❌ Could not read code');}
  };

  const filtered=filter==='all'?learners:learners.filter(l=>learnerStatus(l)===filter);
  const count=learners.length;
  const complete=learners.filter(l=>learnerStatus(l)==='complete').length;
  const onTrack=learners.filter(l=>learnerStatus(l)==='on-track').length;
  const atRisk=learners.filter(l=>learnerStatus(l)==='at-risk').length;
  const avgPct=count?Math.round(learners.reduce((a,l)=>a+Math.round((l.sessions/Math.max(1,l.total))*100),0)/count):0;
  const avgKcPassed=count?Math.round(learners.reduce((a,l)=>a+kcPassed(l),0)/count):0;

  const statCard=(label,val,color,action)=>(
    <div key={label} onClick={action} style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.09)',borderRadius:12,padding:'13px 10px',textAlign:'center',cursor:'pointer',transition:'background .15s'}}
      onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.08)'}
      onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,.04)'}>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:25,color,lineHeight:1}}>{val}</div>
      <div style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:.7,color:'rgba(255,255,255,.35)',marginTop:4}}>{label}</div>
    </div>
  );

  return(
    <div>
      {editing&&<LearnerEditModal learner={editing} onSave={saveLearner} onClose={()=>setEditing(null)}/>}

      {/* Summary row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:9,marginBottom:14}}>
        {statCard('Total',count,'rgba(255,255,255,.75)',()=>setFilter('all'))}
        {statCard('Avg Sessions',avgPct+'%','var(--fd-blue)',()=>setFilter('all'))}
        {statCard('On Track',onTrack,'var(--fd-blue)',()=>setFilter('on-track'))}
        {statCard('At Risk',atRisk,'#F59E0B',()=>setFilter('at-risk'))}
        {statCard('Complete',complete,'#10B981',()=>setFilter('complete'))}
        {statCard('Avg KCs Passed',avgKcPassed+'/'+KC_TOPICS.length,'#A78BFA',()=>setFilter('all'))}
      </div>

      {/* Filter + toolbar */}
      <div style={{display:'flex',gap:7,marginBottom:11,alignItems:'center',flexWrap:'wrap'}}>
        {['all','on-track','at-risk','behind','complete'].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} style={{background:filter===f?'rgba(20,147,255,.2)':'rgba(255,255,255,.05)',border:`1px solid ${filter===f?'rgba(20,147,255,.5)':'rgba(255,255,255,.1)'}`,borderRadius:7,color:filter===f?'var(--fd-blue)':'rgba(255,255,255,.45)',padding:'5px 12px',cursor:'pointer',fontSize:11,fontWeight:700,transition:'all .15s'}}>
            {f==='all'?'All':STATUS_CFG[f]?STATUS_CFG[f].label:f}
          </button>
        ))}
        <div style={{marginLeft:'auto',display:'flex',gap:7}}>
          <button onClick={()=>setShowImport(!showImport)} style={{background:'rgba(255,184,0,.1)',border:'1px solid rgba(255,184,0,.3)',borderRadius:7,color:'var(--fd-yellow)',padding:'5px 13px',cursor:'pointer',fontSize:11,fontWeight:700,whiteSpace:'nowrap'}}>
            📥 Import Code
          </button>
          <button onClick={resetToDemo} style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:7,color:'rgba(255,255,255,.4)',padding:'5px 12px',cursor:'pointer',fontSize:11,fontWeight:700,whiteSpace:'nowrap'}}>
            ↺ Demo Reset
          </button>
        </div>
      </div>

      {/* Import panel */}
      {showImport&&(
        <div style={{background:'rgba(255,184,0,.05)',border:'1px solid rgba(255,184,0,.2)',borderRadius:10,padding:'10px 12px',marginBottom:11,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <input value={importCode} onChange={e=>setImportCode(e.target.value)}
            placeholder="Paste learner progress code here…"
            style={{flex:1,minWidth:200,background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.14)',borderRadius:7,padding:'7px 11px',color:'#fff',fontSize:11,fontFamily:'monospace',outline:'none'}}/>
          <button onClick={applyImport} style={{background:'rgba(255,184,0,.2)',border:'1px solid rgba(255,184,0,.4)',borderRadius:7,color:'var(--fd-yellow)',padding:'7px 14px',cursor:'pointer',fontSize:12,fontWeight:700,whiteSpace:'nowrap'}}>Apply</button>
          {importMsg&&<span style={{fontSize:12,fontWeight:600,color:importMsg.startsWith('✅')?'#10B981':'#EF4444'}}>{importMsg}</span>}
        </div>
      )}

      {/* Learner cards — click to edit */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(270px,1fr))',gap:11}}>
        {filtered.map(l=>{
          const pct=Math.round((l.sessions/Math.max(1,l.total))*100);
          const st=learnerStatus(l);
          const sc=STATUS_CFG[st];
          const ac=avatarColor(l.name);
          const weekNum=Math.min(Math.ceil((l.sessions/Math.max(1,l.total))*WEEKS.length)||1,WEEKS.length);
          const passed=kcPassed(l);
          const taken=kcTaken(l);
          const kcTotal=KC_TOPICS.length;
          // Scores for passed KCs to show avg
          const passedScores=KC_TOPICS.filter(t=>l.kcScores&&(l.kcScores[t]||0)>=KC_PASSING).map(t=>l.kcScores[t]);
          const avgScore=passedScores.length?Math.round(passedScores.reduce((a,v)=>a+v,0)/passedScores.length):null;
          return(
            <div key={l.id} onClick={()=>setEditing(l)} style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.09)',borderRadius:13,padding:'15px',cursor:'pointer',transition:'border-color .15s,background .15s'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,.22)';e.currentTarget.style.background='rgba(255,255,255,.06)';}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,.09)';e.currentTarget.style.background='rgba(255,255,255,.04)';}}>
              <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:10}}>
                <div style={{width:36,height:36,borderRadius:9,background:ac+'33',border:`2px solid ${ac}55`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:900,color:ac,flexShrink:0}}>
                  {initials(l.name)}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{l.name}</div>
                  <div style={{fontSize:10,color:'rgba(255,255,255,.35)',marginTop:1}}>Wk {weekNum} · {l.lastActive}</div>
                </div>
                <span style={{background:sc.bg,color:sc.color,borderRadius:6,padding:'3px 8px',fontSize:10,fontWeight:700,flexShrink:0,whiteSpace:'nowrap'}}>{sc.label}</span>
              </div>
              {/* Sessions bar */}
              <div style={{marginBottom:9}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:10,color:'rgba(255,255,255,.4)',fontWeight:600,letterSpacing:.4}}>SESSIONS</span>
                  <span style={{fontSize:11,fontWeight:700,color:pct>=100?'#10B981':'rgba(255,255,255,.75)'}}>{l.sessions}/{l.total} · {pct}%</span>
                </div>
                <PBar pct={pct} color={pct>=100?'#10B981':sc.color} h={5}/>
              </div>
              {/* KC summary */}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderTop:'1px solid rgba(255,255,255,.07)',paddingTop:8}}>
                <div>
                  <div style={{fontSize:10,color:'rgba(255,255,255,.4)',fontWeight:600,letterSpacing:.4,marginBottom:3}}>KC CHECKS</div>
                  <div style={{fontSize:12,fontWeight:700,color:passed===kcTotal?'#10B981':'rgba(255,255,255,.75)'}}>
                    {passed}<span style={{color:'rgba(255,255,255,.3)',fontWeight:400}}>/{kcTotal} passed</span>
                    {taken>0&&taken>passed&&<span style={{color:'#EF4444',fontWeight:700,marginLeft:5}}>{taken-passed} failed</span>}
                  </div>
                </div>
                {avgScore!=null&&(
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:10,color:'rgba(255,255,255,.4)',fontWeight:600,letterSpacing:.4,marginBottom:3}}>AVG SCORE</div>
                    <div style={{fontSize:15,fontWeight:900,fontFamily:"'Barlow Condensed',sans-serif",color:avgScore>=KC_PASSING?'#10B981':'#F59E0B'}}>{avgScore}%</div>
                  </div>
                )}
              </div>
              <div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:3}}>
                {KC_TOPICS.map((t,i)=>{
                  const s=l.kcScores&&l.kcScores[t];
                  const bg=s==null?'rgba(255,255,255,.1)':s>=KC_PASSING?'#10B981':'#EF4444';
                  return <div key={i} title={`${t}: ${s!=null?s+'%':'not taken'}`} style={{width:9,height:9,borderRadius:2,background:bg,flexShrink:0}}/>;
                })}
              </div>
              <div style={{fontSize:9,color:'rgba(255,255,255,.25)',marginTop:5,textAlign:'right'}}>Click to edit ✏️</div>
            </div>
          );
        })}
      </div>
      {filtered.length===0&&(
        <div style={{textAlign:'center',color:'rgba(255,255,255,.3)',padding:'28px 0',fontSize:13}}>No learners match this filter.</div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   COORDINATOR PANEL  —  multi-wave aware
══════════════════════════════════════════ */
function CoordinatorPanel({onExit}){
  const activeId=getActiveWaveId();
  const clsKey='fd_'+activeId+'_class_url';
  const [cfg,setCfg]=useState({...WAVE_CONFIG,classroomLink:localStorage.getItem(clsKey)||WAVE_CONFIG.classroomLink||''});
  const [scheduleEditorOpen,setScheduleEditorOpen]=useState(false);
  const [trainerInput,setTrainerInput]=useState('');
  const [saved,setSaved]=useState(false);
  // New wave activation
  const [newCfg,setNewCfg]=useState({wave:'',cohort:'',location:WAVE_CONFIG.location,startDate:'',endDate:'',passing:WAVE_CONFIG.passing,trainers:[...WAVE_CONFIG.trainers],maxCredits:WAVE_CONFIG.maxCredits,classroomLink:''});
  const [newTrainerInput,setNewTrainerInput]=useState('');
  const [activateConfirm,setActivateConfirm]=useState('');
  const [activateDone,setActivateDone]=useState(false);
  // Wave history
  const [registry]=useState(()=>loadWaveRegistry());
  // PIN
  const [pinMode,setPinMode]=useState(false);
  const [pinOld,setPinOld]=useState('');
  const [pinNew,setPinNew]=useState('');
  const [pinConfirm,setPinConfirm]=useState('');
  const [pinErr,setPinErr]=useState('');
  const [pinSaved,setPinSaved]=useState(false);

  const set=k=>e=>setCfg(p=>({...p,[k]:e.target.value}));
  const setN=k=>e=>setNewCfg(p=>({...p,[k]:e.target.value}));

  const addTrainer=()=>{const t=trainerInput.trim();if(t&&!cfg.trainers.includes(t)){setCfg(p=>({...p,trainers:[...p.trainers,t]}));setTrainerInput('');}};
  const removeTrainer=name=>setCfg(p=>({...p,trainers:p.trainers.filter(t=>t!==name)}));
  const addNewTrainer=()=>{const t=newTrainerInput.trim();if(t&&!newCfg.trainers.includes(t)){setNewCfg(p=>({...p,trainers:[...p.trainers,t]}));setNewTrainerInput('');}};
  const removeNewTrainer=name=>setNewCfg(p=>({...p,trainers:p.trainers.filter(t=>t!==name)}));

  const saveCfg=()=>{
    const toSave={...cfg,passing:parseInt(cfg.passing)||80,maxCredits:parseInt(cfg.maxCredits)||100};
    registerWave(toSave);
    saveWaveConfig(toSave);
    Object.assign(WAVE_CONFIG,toSave);
    setSaved(true);
    setTimeout(()=>window.location.reload(),1600);
  };

  const activateNewWave=()=>{
    if(activateConfirm!==newCfg.wave.trim())return;
    // Archive current wave
    registerWave({...WAVE_CONFIG});
    // Set up new wave
    const toSave={...newCfg,passing:parseInt(newCfg.passing)||80,maxCredits:parseInt(newCfg.maxCredits)||100};
    const newId=waveSlug(toSave.wave);
    localStorage.setItem('fd_waveconfig_'+newId,JSON.stringify(toSave));
    localStorage.setItem(LS_WAVE_ACTIVE,newId);
    localStorage.setItem('fd_wave_config',JSON.stringify(toSave));
    if(toSave.classroomLink)localStorage.setItem('fd_'+newId+'_class_url',toSave.classroomLink);
    registerWave(toSave);
    setActivateDone(true);
    setTimeout(()=>window.location.reload(),2000);
  };

  const changePin=()=>{
    if(pinOld!==loadCoordPin()){setPinErr('Current PIN is incorrect');return;}
    if(pinNew.length<4){setPinErr('New PIN must be at least 4 characters');return;}
    if(pinNew!==pinConfirm){setPinErr('New PINs do not match');return;}
    saveCoordPin(pinNew);
    setPinSaved(true);
    setPinMode(false);setPinOld('');setPinNew('');setPinConfirm('');setPinErr('');
    setTimeout(()=>setPinSaved(false),3000);
  };

  const inp={background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.14)',borderRadius:8,padding:'9px 12px',color:'#fff',fontSize:13,width:'100%',fontFamily:'Inter,sans-serif',outline:'none'};
  const lbl={fontSize:10,fontWeight:700,letterSpacing:1.2,color:'rgba(255,255,255,.4)',textTransform:'uppercase',marginBottom:5,display:'block'};
  const sec={background:'rgba(255,255,255,.035)',border:'1px solid rgba(255,255,255,.08)',borderRadius:14,padding:22,marginBottom:16};
  const secHead={fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:19,letterSpacing:1,marginBottom:16,display:'flex',alignItems:'center',gap:8};

  const TrainerRow=({trainers,onRemove})=>(
    <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:10,minHeight:32}}>
      {trainers.map(t=>(
        <div key={t} style={{background:'rgba(20,147,255,.14)',border:'1px solid rgba(20,147,255,.28)',borderRadius:7,padding:'5px 10px 5px 12px',fontSize:12,fontWeight:600,display:'flex',alignItems:'center',gap:8,color:'rgba(255,255,255,.85)'}}>
          {t}
          <span onClick={()=>onRemove(t)} style={{cursor:'pointer',color:'rgba(255,255,255,.35)',fontWeight:900,fontSize:15,lineHeight:1}} onMouseEnter={e=>e.target.style.color='#FF6B6B'} onMouseLeave={e=>e.target.style.color='rgba(255,255,255,.35)'}>×</span>
        </div>
      ))}
    </div>
  );

  return(
    <div style={{position:'fixed',inset:0,zIndex:1200,background:'rgba(2,5,14,.97)',backdropFilter:'blur(20px)',overflowY:'auto',fontFamily:'Inter,sans-serif'}}>
      {/* Header */}
      <div style={{background:'linear-gradient(90deg,rgba(255,184,0,.1),rgba(20,147,255,.05))',borderBottom:'1px solid rgba(255,184,0,.22)',padding:'13px 24px',display:'flex',alignItems:'center',gap:12,position:'sticky',top:0,zIndex:10,backdropFilter:'blur(12px)'}}>
        <div style={{width:36,height:36,borderRadius:10,background:'rgba(255,184,0,.15)',border:'1px solid rgba(255,184,0,.3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🎛️</div>
        <div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:21,letterSpacing:1.2,color:'var(--fd-yellow)'}}>COORDINATOR MODE</div>
          <div style={{fontSize:10,color:'rgba(255,255,255,.35)',letterSpacing:.8}}>CXO Training Command Center · Active Wave: <span style={{color:'rgba(255,184,0,.7)'}}>{WAVE_CONFIG.wave}</span></div>
        </div>
        <button onClick={onExit} style={{marginLeft:'auto',background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.14)',borderRadius:8,color:'rgba(255,255,255,.65)',padding:'8px 18px',cursor:'pointer',fontSize:12,fontWeight:700}}>✕ Exit to Portal</button>
      </div>

      {scheduleEditorOpen&&<ScheduleEditor onClose={()=>setScheduleEditorOpen(false)}/>}

      <div style={{maxWidth:900,margin:'0 auto',padding:'24px 24px 60px'}}>

        {/* ── Learner Dashboard ── */}
        <div style={{...sec,borderColor:'rgba(255,184,0,.2)',background:'rgba(255,184,0,.03)'}}>
          <div style={{...secHead,color:'var(--fd-yellow)'}}>📊 LEARNER DASHBOARD — {WAVE_CONFIG.wave}</div>
          <CoordinatorDashboard/>
        </div>

        {/* ── Schedule Editor shortcut ── */}
        <div style={{background:'rgba(20,147,255,.05)',border:'1px solid rgba(20,147,255,.18)',borderRadius:14,padding:'16px 20px',marginBottom:16,display:'flex',alignItems:'center',gap:14}}>
          <div style={{fontSize:28}}>📅</div>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:17,color:'var(--fd-blue)',letterSpacing:.5}}>SCHEDULE EDITOR</div>
            <div style={{fontSize:11,color:'rgba(255,255,255,.4)',marginTop:2}}>{WEEKS.length} weeks · {WEEKS.reduce((a,w)=>a+w.days.length,0)} days · {WEEKS.reduce((a,w)=>a+w.days.reduce((b,d)=>b+d.sessions.length,0),0)} sessions{loadSchedule()?<span style={{color:'var(--fd-green)',marginLeft:8,fontWeight:600}}>✓ Custom schedule active</span>:<span style={{color:'rgba(255,255,255,.3)',marginLeft:8}}>Using default schedule</span>}</div>
          </div>
          <button onClick={()=>setScheduleEditorOpen(true)} style={{background:'rgba(20,147,255,.15)',border:'1px solid rgba(20,147,255,.35)',borderRadius:9,color:'var(--fd-blue)',padding:'10px 20px',cursor:'pointer',fontSize:12,fontWeight:700,whiteSpace:'nowrap'}}>
            Open Editor →
          </button>
        </div>

        {/* ── Training Schedule Upload ── */}
        <div style={sec}>
          <div style={{...secHead,color:'var(--fd-blue)',marginBottom:14}}>📊 TRAINING SCHEDULE — IMPORT FROM EXCEL</div>
          <TrainingScheduleUploader/>
        </div>

        {/* ── Buddy Schedule ── */}
        <div style={sec}>
          <div style={{...secHead,color:'#10B981',marginBottom:14}}>🟢 BUDDY SCHEDULE</div>
          <BuddyScheduleEditor/>
        </div>

        {/* ── Edit Current Wave ── */}
        <div style={sec}>
          <div style={{...secHead,color:'var(--fd-yellow)'}}>⚡ CURRENT WAVE — {WAVE_CONFIG.wave}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
            <div><span style={lbl}>Wave Name</span><input style={inp} value={cfg.wave} onChange={set('wave')}/></div>
            <div><span style={lbl}>Cohort Label</span><input style={inp} value={cfg.cohort} onChange={set('cohort')}/></div>
            <div><span style={lbl}>Location</span><input style={inp} value={cfg.location} onChange={set('location')}/></div>
            <div><span style={lbl}>KC Passing Score (%)</span><input style={inp} type="number" min="0" max="100" value={cfg.passing} onChange={set('passing')}/></div>
            <div><span style={lbl}>Start Date</span><input style={inp} type="date" value={cfg.startDate} onChange={set('startDate')}/></div>
            <div><span style={lbl}>End Date</span><input style={inp} type="date" value={cfg.endDate} onChange={set('endDate')}/></div>
          </div>
          <div style={{marginBottom:14}}>
            <span style={lbl}>Classroom Link (Class.com)</span>
            <input style={inp} value={cfg.classroomLink} onChange={set('classroomLink')} placeholder="https://class.com/your-room-link"/>
          </div>
          <div style={{marginBottom:18}}>
            <span style={lbl}>Max Credit Authority ($)</span>
            <input style={{...inp,width:160}} type="number" min="0" value={cfg.maxCredits} onChange={set('maxCredits')}/>
          </div>
          <div style={{marginBottom:18}}>
            <span style={lbl}>Training Team</span>
            <TrainerRow trainers={cfg.trainers} onRemove={removeTrainer}/>
            <div style={{display:'flex',gap:8}}>
              <input style={{...inp,flex:1}} value={trainerInput} onChange={e=>setTrainerInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTrainer()} placeholder="Add trainer and press Enter…"/>
              <button onClick={addTrainer} style={{background:'rgba(20,147,255,.14)',border:'1px solid rgba(20,147,255,.3)',borderRadius:8,color:'var(--fd-blue)',padding:'9px 16px',cursor:'pointer',fontSize:12,fontWeight:700,whiteSpace:'nowrap'}}>+ Add</button>
            </div>
          </div>
          <button onClick={saveCfg} style={{background:saved?'rgba(132,181,0,.18)':'rgba(255,184,0,.12)',border:`1px solid ${saved?'rgba(132,181,0,.45)':'rgba(255,184,0,.35)'}`,borderRadius:10,color:saved?'#84B500':'var(--fd-yellow)',padding:'12px 20px',cursor:'pointer',fontSize:13,fontWeight:700,width:'100%',transition:'all .25s'}}>
            {saved?'✓ Saved — Reloading…':'💾 Save Changes to Current Wave'}
          </button>
        </div>

        {/* ── Activate New Wave ── */}
        <div style={{...sec,border:'1px solid rgba(20,147,255,.2)',background:'rgba(20,147,255,.03)'}}>
          <div style={{...secHead,color:'var(--fd-blue)'}}>🚀 ACTIVATE NEW WAVE</div>
          <p style={{fontSize:12,color:'rgba(255,255,255,.45)',marginBottom:16,lineHeight:1.7}}>
            Start a fresh wave without losing anything. <strong style={{color:'rgba(255,255,255,.65)'}}>All {WAVE_CONFIG.wave} data is preserved</strong> — learners can still access it. New learners will onboard into the new wave automatically.
          </p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
            <div><span style={lbl}>New Wave Name</span><input style={inp} value={newCfg.wave} onChange={setN('wave')} placeholder="Wave 87"/></div>
            <div><span style={lbl}>Cohort Label</span><input style={inp} value={newCfg.cohort} onChange={setN('cohort')} placeholder="NJ Wave 87"/></div>
            <div><span style={lbl}>Location</span><input style={inp} value={newCfg.location} onChange={setN('location')}/></div>
            <div><span style={lbl}>KC Passing Score (%)</span><input style={inp} type="number" min="0" max="100" value={newCfg.passing} onChange={setN('passing')}/></div>
            <div><span style={lbl}>Start Date</span><input style={inp} type="date" value={newCfg.startDate} onChange={setN('startDate')}/></div>
            <div><span style={lbl}>End Date</span><input style={inp} type="date" value={newCfg.endDate} onChange={setN('endDate')}/></div>
          </div>
          <div style={{marginBottom:14}}>
            <span style={lbl}>Classroom Link</span>
            <input style={inp} value={newCfg.classroomLink} onChange={setN('classroomLink')} placeholder="https://class.com/new-room-link"/>
          </div>
          <div style={{marginBottom:18}}>
            <span style={lbl}>Training Team</span>
            <TrainerRow trainers={newCfg.trainers} onRemove={removeNewTrainer}/>
            <div style={{display:'flex',gap:8}}>
              <input style={{...inp,flex:1}} value={newTrainerInput} onChange={e=>setNewTrainerInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNewTrainer()} placeholder="Add trainer and press Enter…"/>
              <button onClick={addNewTrainer} style={{background:'rgba(20,147,255,.14)',border:'1px solid rgba(20,147,255,.3)',borderRadius:8,color:'var(--fd-blue)',padding:'9px 16px',cursor:'pointer',fontSize:12,fontWeight:700,whiteSpace:'nowrap'}}>+ Add</button>
            </div>
          </div>
          {activateDone?(
            <div style={{textAlign:'center',padding:'18px 0',color:'#84B500',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:20}}>✓ {newCfg.wave} activated — Reloading portal…</div>
          ):(
            <>
              <div style={{background:'rgba(20,147,255,.08)',border:'1px solid rgba(20,147,255,.18)',borderRadius:9,padding:'12px 16px',marginBottom:14}}>
                <div style={{fontSize:11,color:'rgba(255,255,255,.5)',marginBottom:6,fontWeight:600}}>Type the new wave name to confirm activation</div>
                <input
                  style={{...inp,borderColor:newCfg.wave&&activateConfirm===newCfg.wave.trim()?'rgba(20,147,255,.5)':'rgba(255,255,255,.14)'}}
                  value={activateConfirm}
                  onChange={e=>setActivateConfirm(e.target.value)}
                  placeholder={newCfg.wave?`Type "${newCfg.wave}" to confirm`:'Fill in wave name above first'}
                />
              </div>
              <button
                onClick={activateNewWave}
                disabled={!newCfg.wave||activateConfirm!==newCfg.wave.trim()}
                style={{background:newCfg.wave&&activateConfirm===newCfg.wave.trim()?'rgba(20,147,255,.18)':'rgba(255,255,255,.04)',border:`1px solid ${newCfg.wave&&activateConfirm===newCfg.wave.trim()?'rgba(20,147,255,.45)':'rgba(255,255,255,.1)'}`,borderRadius:10,color:newCfg.wave&&activateConfirm===newCfg.wave.trim()?'var(--fd-blue)':'rgba(255,255,255,.2)',padding:'12px 20px',cursor:newCfg.wave&&activateConfirm===newCfg.wave.trim()?'pointer':'not-allowed',fontSize:13,fontWeight:700,width:'100%',transition:'all .25s'}}>
                🚀 Activate {newCfg.wave||'New Wave'} — Previous Data Preserved
              </button>
            </>
          )}
        </div>

        {/* ── Wave History ── */}
        {registry.length>0&&(
          <div style={sec}>
            <div style={{...secHead,color:'rgba(255,255,255,.6)'}}>📋 WAVE HISTORY ({registry.length})</div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {[...registry].reverse().map(w=>{
                const stats=getWaveStats(w.id);
                const isCurrent=w.id===activeId;
                return(
                  <div key={w.id} style={{background:isCurrent?'rgba(255,184,0,.07)':'rgba(255,255,255,.04)',border:`1px solid ${isCurrent?'rgba(255,184,0,.25)':'rgba(255,255,255,.08)'}`,borderRadius:10,padding:'14px 16px',display:'flex',alignItems:'center',gap:14}}>
                    <div style={{flex:1}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
                        <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:16,color:isCurrent?'var(--fd-yellow)':'rgba(255,255,255,.8)'}}>{w.wave}</span>
                        {isCurrent&&<span style={{fontSize:9,fontWeight:800,background:'rgba(255,184,0,.18)',color:'var(--fd-yellow)',padding:'2px 7px',borderRadius:4,letterSpacing:.8,textTransform:'uppercase'}}>Active</span>}
                      </div>
                      <div style={{fontSize:11,color:'rgba(255,255,255,.4)'}}>{w.cohort} · {w.startDate||'—'} to {w.endDate||'—'}</div>
                      {stats.hasData&&(
                        <div style={{display:'flex',gap:12,marginTop:5,fontSize:11,color:'rgba(255,255,255,.35)'}}>
                          <span>👤 {stats.name||'Learner'}</span>
                          <span>⚡ {stats.xp} XP</span>
                          <span>✅ {stats.sessions} sessions</span>
                          <span>🎯 {stats.kcPassed} KCs passed</span>
                        </div>
                      )}
                      {!stats.hasData&&<div style={{fontSize:11,color:'rgba(255,255,255,.25)',marginTop:4}}>No learner data recorded</div>}

function getNextAction(checked,kcResults){
  // Priority 1: Unlocked KC with a failed attempt and retake available
  for(const kc of KNOWLEDGE_CHECKS){
    const res=kcResults[kc.topic];
    const attempts=res?res.attempts||1:0;
    if(res&&!res.passed&&attempts<2&&isKCUnlocked(kc.topic,checked))
      return{type:'retake',kc,msg:`You scored ${res.pct}% on "${kc.topic}" — you have one retake left.`,cta:'Retake Now →',view:'checks'};
  }
  // Priority 2: Unlocked KC not yet attempted
  for(const kc of KNOWLEDGE_CHECKS){
    if(!kcResults[kc.topic]&&isKCUnlocked(kc.topic,checked))
      return{type:'kc',kc,msg:`"${kc.topic}" is unlocked and ready for you.`,cta:'Take the Check →',view:'checks'};
  }
  // Priority 3: Next unchecked non-break session
  for(let wi=0;wi<WEEKS.length;wi++){
    for(let di=0;di<WEEKS[wi].days.length;di++){
      for(let si=0;si<WEEKS[wi].days[di].sessions.length;si++){
        const s=WEEKS[wi].days[di].sessions[si];
        const key=`${wi}-${di}-${si}`;
        if(s.cat!=='break'&&!checked[key])
          return{type:'session',session:s,msg:`Up next on your schedule: "${s.title}"`,cta:'Go to Schedule →',view:'schedule'};
      }
    }
  }
  return{type:'done',msg:"You've completed everything — you're a Pro! 🏆",cta:'View Profile →',view:'profile'};
}

// ── Category normalizer ──
const CAT_NORM={
  sports:'sports',sport:'sports',
  systems:'systems',system:'systems',tech:'systems',it:'systems',
  comply:'comply',compliance:'comply',
  onboard:'onboard',onboarding:'onboard',hr:'onboard',
  payments:'payments',payment:'payments',finance:'payments',
  casino:'casino',
  platform:'platform',crm:'platform',ace:'platform',
  desk:'desk','on desk':'desk',buddy:'desk',
  break:'break',lunch:'break',
};
function normalizecat(raw){const k=(raw||'').toLowerCase().trim();return CAT_NORM[k]||'onboard';}

// ── Parse .xlsx ArrayBuffer → 2D string array (first sheet) ──
function xlsxTo2D(buf){
  const wb=XLSX.read(buf,{type:'array',cellText:true,cellNF:false});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
  return data.map(row=>row.map(c=>String(c||'').trim()));
}

// ── Build buddy schedule from 2D array (same logic as paste parser) ──
function buildBuddyFrom2D(rows){
  if(!rows||rows.length<2)return null;
  const headers=rows[0];
  const dates=headers.slice(1).map(h=>h.trim()).filter(Boolean);
  const agentRows=rows.slice(1).filter(r=>r[0]&&r[0].trim());
  const result={
    dates,
    rows:agentRows.map(r=>({
      agent:r[0].trim(),
      cells:Object.fromEntries(dates.map((d,i)=>[d,parseBuddyCell(r[i+1]||'')]))
    })),
    updatedAt:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
  };
  return result.rows.length>0?result:null;
}

// ── Auto-categorize a session from its title ──
function categorizeSessionTitle(title){
  const t=(title||'').toLowerCase();
  if(/lunch|break|breakfast|holiday|closed|off day/.test(t)) return 'break';
  if(/sport|betting|bet activity|bet type|spread|parlay|moneyline|wager|odds/.test(t)) return 'sports';
  if(/adminweb|admin web|ace |salesforce|ti2|openbet|dayforce|maestro|slack|outlook|tech platform|geoco|nice |zoom etiquette|review quiz|training camp|resources|quick guide|qr |create admin|schedule ac/.test(t)) return 'systems';
  if(/licens|responsib|detect|prevent|kyc|verify|verific|legal|notari|background|geocomply|sign licens|aml|anti-money|anti-brib|conflict|data privacy|cybersec|responsible gaming/.test(t)) return 'comply';
  if(/payment|deposit|withdraw|cashier|banking|pay for perf|p4p/.test(t)) return 'payments';
  if(/casino|slot/.test(t)) return 'casino';
  if(/on.?desk|live contact|buddy week/.test(t)) return 'desk';
  if(/sandbox|vip|cx recovery|promotions|tier 2|platform|product overview|quality/.test(t)) return 'platform';
  return 'onboard';
}

// ── Helper functions for schedule parsing (module scope for Babel compatibility) ──
var _SCHED_DAY_PAT=/monday|tuesday|wednesday|thursday|friday|saturday|sunday|holiday|mlk day|off day/i;
var _SCHED_TIME_PAT=/^\s*\d{1,2}:\d{2}/;
var _SCHED_WEEK_PAT=/^(week\s*[\d\-]|buddy\s*week|virtual)/i;
function _schedGetDayHeader(row){
  var a=String(row[0]||'');var b=String(row[1]||'');
  if(_SCHED_DAY_PAT.test(a)&&!row[1]&&!row[2])return a;
  if(!row[0]&&_SCHED_DAY_PAT.test(b)&&!row[2])return b;
  return null;
}
function _schedGetWeekLabel(row){
  var b=String(row[1]||'');
  if(!row[0]&&_SCHED_WEEK_PAT.test(b))return b;
  return null;
}
function _schedIsSession(row){
  return!row[0]&&_SCHED_TIME_PAT.test(String(row[1]||''))&&String(row[2]||'').trim();
}

// ── Parse training schedule Excel (actual coordinator format) into WEEKS ──
function buildScheduleFrom2D(rows){
  if(!rows||rows.length<2)return null;
  var weeks=[];var curWeek=null;var curDay=null;var wNum=1;

  for(var r=0;r<rows.length;r++){
    var row=rows[r];
    if(row.every(function(c){return!c;}))continue;

    var wLabel=_schedGetWeekLabel(row);
    if(wLabel){
      var isBuddy=/buddy/i.test(wLabel);
      var isVirtualW=/virtual/i.test(wLabel);
      var numM=wLabel.match(/week\s*(\d+)/i);
      var wlLabel=numM?('Week '+numM[1]):isBuddy?'Buddy Week':wLabel.split('\n')[0].trim();
      curWeek={label:wlLabel,sub:wLabel.split('\n')[0].trim(),theme:wlLabel,done:false,buddy:isBuddy,virtual:isVirtualW,days:[]};
      weeks.push(curWeek);curDay=null;
      continue;
    }

    var dayText=_schedGetDayHeader(row);
    if(dayText){
      if(!curWeek){curWeek={label:'Week '+wNum++,sub:'',theme:'',done:false,buddy:false,virtual:false,days:[]};weeks.push(curWeek);}
      var isHoliday=/holiday|closed|mlk|off day/i.test(dayText);
      var isVirtualD=/virtual/i.test(dayText)||(curWeek&&curWeek.virtual);
      var firstLine=dayText.split('\n')[0].trim();
      var trainerLines=dayText.match(/(?:(?:\d(?:st|nd|rd|th)|AM|PM)\s*TC|[Tt]rainers?):\s*([^\n]+)/g)||[];
      var trainers=[...new Set(trainerLines.flatMap(function(m){
        var v=m.replace(/.*?:\s*/,'');
        return v.split(/[,\/]/).map(function(t){return t.trim();}).filter(Boolean);
      }))];
      var ooo=(dayText.match(/OOO:\s*([^\n]+)/i)||[])[1]||'';
      curDay={date:firstLine,trainers:trainers,sessions:[],virtual:isVirtualD,ooo:ooo,holiday:isHoliday};
      curWeek.days.push(curDay);
      if(isHoliday){
        curDay.sessions.push({t:'All day',title:firstLine+' - Closed',who:'',cat:'break',dur:'',info:''});
      }
      continue;
    }

    if(_schedIsSession(row)){
      if(!curWeek){curWeek={label:'Week '+wNum++,sub:'',theme:'',done:false,buddy:false,virtual:false,days:[]};weeks.push(curWeek);}
      if(!curDay){curDay={date:'',trainers:[],sessions:[]};curWeek.days.push(curDay);}
      var time=String(row[1]||'').trim();
      var title=String(row[2]||'').trim().split('\n')[0];
      var trainer=String(row[3]||'').trim();
      var notes=String(row[4]||'').trim();
      curDay.sessions.push({t:time,title:title,who:trainer,cat:categorizeSessionTitle(title),dur:'',info:notes});
    }
  }
  return weeks.length>0?weeks:null;
}
