// Parse a single cell value from Excel paste
function parseBuddyCell(raw){
  const t=(raw||'').trim();
  if(!t||/^off$/i.test(t)) return{type:'off'};
  if(/^pto$/i.test(t)) return{type:'pto'};
  const timeRx=/\d{1,2}:\d{2}\s*[AP]M\s*[-–]\s*\d{1,2}:\d{2}\s*[AP]M/i;
  const lines=t.split(/\n/).map(l=>l.trim()).filter(Boolean);
  // Multi-line: last line might be the shift time
  if(lines.length>=2){
    const last=lines[lines.length-1];
    if(timeRx.test(last)) return{type:'working',buddy:lines.slice(0,-1).join(' / '),shift:last};
  }
  // Single line: try to extract time
  const m=t.match(timeRx);
  if(m) return{type:'working',buddy:t.replace(m[0],'').trim()||'',shift:m[0]};
  // Just a name, no shift found
  return{type:'working',buddy:t,shift:''};
}

// Parse tab-separated Excel paste (handles quoted multiline cells)
function parseExcelPaste(text){
  const rows=[];let cur=[];let cell='';let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){inQ=!inQ;}
    else if(c==='\t'&&!inQ){cur.push(cell);cell='';}
    else if((c==='\n'||(c==='\r'&&text[i+1]==='\n'))&&!inQ){
      if(c==='\r')i++;
      cur.push(cell);cell='';
      if(cur.some(x=>x.trim())) rows.push(cur);
      cur=[];
    } else {cell+=c;}
  }
  if(cell||cur.length){cur.push(cell);if(cur.some(x=>x.trim()))rows.push(cur);}
  return rows;
}

function buildBuddySchedule(pastedText){
  const rows=parseExcelPaste(pastedText);
  if(rows.length<2) return null;
  // First row = headers: col0=Agent label, rest=dates
  const headers=rows[0];
  const dates=headers.slice(1).map(h=>h.trim()).filter(Boolean);
  const agentRows=rows.slice(1).filter(r=>r[0]&&r[0].trim());
  const result={
    dates,
    rows:agentRows.map(r=>({
      agent:r[0].trim(),
      cells:Object.fromEntries(dates.map((d,i)=>[d,parseBuddyCell(r[i+1]||'')]))
    })),
    updatedAt:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
  };
  return result.rows.length>0?result:null;
}

                  {preview.dates.map(d=><th key={d} style={{padding:'7px 10px',fontSize:9,fontWeight:700,color:'rgba(255,255,255,.4)',textAlign:'center',borderBottom:'1px solid rgba(255,255,255,.1)',borderLeft:'1px solid rgba(255,255,255,.06)',minWidth:90,whiteSpace:'nowrap'}}>{d}</th>)}

        </div>
      )}

  );
}

// ── Training Schedule Uploader (Coordinator Mode) ──
function TrainingScheduleUploader(){
  const [preview,setPreview]=useState(null);
  const [parseErr,setParseErr]=useState('');
  const [applied,setApplied]=useState(false);
  const fileRef=React.useRef();
  const hasCustom=!!loadSchedule();

  const handleFile=e=>{
    const file=e.target.files[0];if(!file)return;
    setParseErr('');setPreview(null);
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const rows=xlsxTo2D(new Uint8Array(ev.target.result));
        const result=buildScheduleFrom2D(rows);
        if(!result){setParseErr('Could not parse the file — make sure it follows the template format (columns: Week, Day, Time, Title, Trainer, Category, Duration, Notes).');return;}
        setPreview(result);
      }catch(err){setParseErr('Error reading file: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
  };

  const apply=()=>{
    if(!preview)return;
    saveSchedule(preview);
    WEEKS.splice(0,WEEKS.length,...preview);
    setApplied(true);
    setTimeout(()=>window.location.reload(),700);
  };

  const reset=()=>{
    if(window.confirm('Remove the uploaded schedule and restore the default schedule?')){
      try{localStorage.removeItem(wk('schedule'));}catch(e){}
      window.location.reload();
    }
  };

  const totalDays=preview?preview.reduce((a,w)=>a+w.days.length,0):0;
  const totalSessions=preview?preview.reduce((a,w)=>a+w.days.reduce((b,d)=>b+d.sessions.length,0),0):0;

  return(
    <div>
      {/* Action buttons row */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <button onClick={()=>fileRef.current.click()} style={{background:'rgba(20,147,255,.14)',border:'1px solid rgba(20,147,255,.3)',borderRadius:8,color:'var(--fd-blue)',padding:'9px 16px',cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>
          📁 Upload Schedule .xlsx
        </button>
        <button onClick={downloadScheduleTemplate} style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:8,color:'rgba(255,255,255,.6)',padding:'9px 16px',cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>
          ⬇ Download Template
        </button>
        {hasCustom&&!preview&&(
          <button onClick={reset} style={{marginLeft:'auto',background:'rgba(255,80,80,.07)',border:'1px solid rgba(255,80,80,.18)',borderRadius:7,color:'#FF7070',padding:'7px 12px',cursor:'pointer',fontSize:11,fontWeight:700}}>
            Remove Custom Schedule
          </button>
        )}
      </div>
      <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} style={{display:'none'}}/>

      <div style={{fontSize:11,color:'rgba(255,255,255,.38)',lineHeight:1.7,marginBottom:8}}>
        Upload the coordinator Schedule Excel file (same format used in the Wave folder). Day headers go in column A, times in column B, session titles in column C. Week labels like "Week 2 - Virtual" act as group separators. Download the template to see the exact layout.
      </div>

      {hasCustom&&!preview&&(
        <div style={{fontSize:11,color:'rgba(16,185,129,.7)',padding:'8px 12px',background:'rgba(16,185,129,.07)',border:'1px solid rgba(16,185,129,.18)',borderRadius:7,marginBottom:8}}>
          ✓ A custom schedule is active — {WEEKS.length} weeks · {WEEKS.reduce((a,w)=>a+w.days.length,0)} days. Upload a new file to replace it.
        </div>
      )}

      {parseErr&&<div style={{color:'#FF7070',fontSize:11,marginTop:8,padding:'8px 12px',background:'rgba(255,80,80,.07)',borderRadius:7,border:'1px solid rgba(255,80,80,.15)'}}>{parseErr}</div>}

      {/* Preview */}
      {preview&&(
        <div style={{marginTop:12}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:13,color:'rgba(255,255,255,.6)',letterSpacing:.5,marginBottom:10}}>
            PREVIEW — {preview.length} WEEK{preview.length!==1?'S':''} · {totalDays} DAYS · {totalSessions} SESSIONS
          </div>
          {/* Weeks summary table */}
          <div style={{overflowX:'auto',borderRadius:10,border:'1px solid rgba(255,255,255,.09)',marginBottom:14,maxHeight:280,overflowY:'auto'}}>
            <table style={{borderCollapse:'collapse',width:'100%',minWidth:400}}>
              <thead>
                <tr style={{background:'rgba(255,255,255,.05)'}}>
                  {['Week','Days','Sessions','Sample Sessions'].map(h=>(
                    <th key={h} style={{padding:'7px 12px',fontSize:9,fontWeight:800,color:'rgba(255,255,255,.45)',textAlign:'left',borderBottom:'1px solid rgba(255,255,255,.09)',whiteSpace:'nowrap'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {preview.map((w,wi)=>{
                  const sessions=w.days.flatMap(d=>d.sessions);
                  const samples=sessions.slice(0,3).map(s=>s.title).join(' · ');
                  return(
                    <tr key={wi} style={{background:wi%2===0?'transparent':'rgba(255,255,255,.02)'}}>
                      <td style={{padding:'6px 12px',fontSize:11,fontWeight:700,color:w.buddy?'#F59E0B':'rgba(255,255,255,.75)',borderBottom:'1px solid rgba(255,255,255,.05)',whiteSpace:'nowrap'}}>
                        {w.buddy?'🤝 ':''}{w.label}
                      </td>
                      <td style={{padding:'6px 12px',fontSize:11,color:'rgba(255,255,255,.55)',borderBottom:'1px solid rgba(255,255,255,.05)',textAlign:'center'}}>{w.days.length}</td>
                      <td style={{padding:'6px 12px',fontSize:11,color:'rgba(255,255,255,.55)',borderBottom:'1px solid rgba(255,255,255,.05)',textAlign:'center'}}>{sessions.length}</td>
                      <td style={{padding:'6px 12px',fontSize:10,color:'rgba(255,255,255,.35)',borderBottom:'1px solid rgba(255,255,255,.05)',maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{samples}{sessions.length>3?` +${sessions.length-3} more`:''}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
            <button onClick={apply} disabled={applied} style={{background:applied?'rgba(132,181,0,.18)':'rgba(20,147,255,.16)',border:`1px solid ${applied?'rgba(132,181,0,.4)':'rgba(20,147,255,.35)'}`,borderRadius:10,color:applied?'#84B500':'var(--fd-blue)',padding:'11px 24px',cursor:applied?'default':'pointer',fontSize:13,fontWeight:700,transition:'all .25s'}}>
              {applied?'✓ Applied — Reloading…':'✅ Apply This Schedule'}
            </button>
            <button onClick={()=>{setPreview(null);setParseErr('');if(fileRef.current)fileRef.current.value='';}} style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.1)',borderRadius:9,color:'rgba(255,255,255,.45)',padding:'11px 18px',cursor:'pointer',fontSize:12,fontWeight:700}}>
              Cancel
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function Schedule({checked,onToggle,profile}){
  const [wk,setWk]=useState(0);
  const [open,setOpen]=useState(null);
  const [buddyView,setBuddyView]=useState(false);
  const hasBuddy=!!loadBuddySchedule();
  const week=WEEKS[wk];
  const nb=s=>s.cat!=='break';
  const total=week.days.reduce((a,d)=>a+d.sessions.filter(nb).length,0);
  const done=week.days.reduce((a,d,di)=>a+d.sessions.filter((s,si)=>nb(s)&&checked[`${wk}-${di}-${si}`]).length,0);
  return(
    <div className="a1" style={{maxWidth:880}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:16}}>
        <div>
          <div className="eyebrow">{WAVE_CONFIG.cohort} · {WAVE_CONFIG.startDate} – {WAVE_CONFIG.endDate}</div>
          <div className="page-title">{buddyView?'Buddy Schedule':'My Training Schedule'}</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:8}}>
          {!buddyView&&<div style={{textAlign:'right'}}><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:34,fontWeight:900,lineHeight:1,color:'var(--fd-blue)'}}>{done}<span style={{fontSize:16,color:'var(--t3)',fontWeight:600}}>/{total}</span></div><div style={{fontSize:9,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:.8}}>{week.label} sessions done</div></div>}
          <button onClick={()=>setBuddyView(v=>!v)} style={{background:buddyView?'rgba(16,185,129,.14)':'rgba(255,255,255,.06)',border:`1px solid ${buddyView?'rgba(16,185,129,.35)':'rgba(255,255,255,.14)'}`,borderRadius:8,color:buddyView?'#10B981':'rgba(255,255,255,.5)',padding:'6px 14px',cursor:'pointer',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>
            {buddyView?'📅 Training Schedule':'🟢 Buddy Schedule'}{!hasBuddy&&!buddyView&&<span style={{fontSize:9,color:'rgba(255,255,255,.25)',fontWeight:400}}>(coming soon)</span>}
          </button>
        </div>
      </div>

      {buddyView?(
        <BuddyScheduleView profile={profile}/>
      ):(<>
      <div className="a2" style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        {WEEKS.map((w,i)=>(
          <div key={i} className={`wtab${wk===i?' act':''}`}
            style={w.buddy&&wk!==i?{borderColor:'rgba(16,185,129,.3)',color:'rgba(16,185,129,.7)'}:w.buddy&&wk===i?{background:'rgba(16,185,129,.12)',borderColor:'rgba(16,185,129,.45)',color:'#10B981'}:{}}
            onClick={()=>setWk(i)}>
            <div>{w.label}{w.buddy&&<span style={{marginLeft:4,fontSize:8,verticalAlign:'middle'}}>🟢</span>}</div>
            <div style={{fontSize:9,opacity:.65,fontFamily:'Inter,sans-serif',fontWeight:500}}>{w.sub}</div>
          </div>
        ))}
        <div style={{marginLeft:'auto',display:'flex',gap:5,flexWrap:'wrap'}}>
          {['sports','systems','comply','payments','casino','platform','desk'].map(c=>{const cat=CATS[c];return<span key={c} className="cpill" style={{background:cat.bg,color:cat.color,fontSize:8,padding:'2px 5px'}}>{cat.label}</span>})}
        </div>
      </div>
      {week.buddy&&(
        <div className="a2" style={{background:'rgba(16,185,129,.08)',border:'1px solid rgba(16,185,129,.25)',borderRadius:12,padding:'14px 18px',marginBottom:12,display:'flex',gap:14,alignItems:'flex-start'}}>
          <div style={{fontSize:28,flexShrink:0}}>🟢</div>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:16,color:'#10B981',marginBottom:4}}>{week.label} — On-Desk Supervised Practice</div>
            <p style={{fontSize:12,color:'var(--t2)',lineHeight:1.6,marginBottom:8}}>During Buddy Week, you work live contacts side-by-side with an experienced agent (your "buddy"). The exact daily schedule is managed by your coordinator and is typically shared via a team spreadsheet updated each week.</p>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <span style={{background:'rgba(16,185,129,.12)',color:'#10B981',borderRadius:6,padding:'3px 10px',fontSize:10,fontWeight:700,border:'1px solid rgba(16,185,129,.3)'}}>📋 Ask your coordinator for the week's buddy schedule</span>
              <span style={{background:'rgba(255,184,0,.1)',color:'var(--fd-yellow)',borderRadius:6,padding:'3px 10px',fontSize:10,fontWeight:700,border:'1px solid rgba(255,184,0,.25)'}}>✅ Mark sessions done as you complete them</span>
            </div>
          </div>
        </div>
      )}
      <div className="a3" style={{display:'flex',flexDirection:'column',gap:12}}>
        {week.days.map((day,di)=>(
          <div key={di} className="day-blk">
            <div className="day-hdr">
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:15}}>{day.date}</span>
                {day.virtual&&<span style={{background:'rgba(20,147,255,.12)',color:'var(--fd-blue)',border:'1px solid rgba(20,147,255,.3)',borderRadius:5,padding:'2px 7px',fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:.5}}>🖥 Virtual</span>}
                {day.note&&<span style={{background:'rgba(245,158,11,.13)',color:'#F59E0B',border:'1px solid rgba(245,158,11,.3)',borderRadius:5,padding:'2px 7px',fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:.5}}>{day.note}</span>}
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                {day.trainers.length>0&&<span style={{fontSize:11,color:'var(--t3)'}}>🎓 {day.trainers.join(' · ')}</span>}
                <span style={{fontSize:10,color:'var(--t3)',fontWeight:600}}>{day.sessions.filter(nb).length} sessions</span>
              </div>
            </div>
            {day.sessions.map((s,si)=>{
              const key=`${wk}-${di}-${si}`;
              const isOpen=open===key;
              const isDone=!!checked[key];
              const isBreak=s.cat==='break';
              return(
                <div key={si} className={`sess-row${isOpen?' open':''}`} onClick={()=>!isBreak&&setOpen(isOpen?null:key)}>
                  {!isBreak?<Chk on={isDone} toggle={()=>onToggle(key)}/>:<div style={{width:16}}/>}
                  <div style={{width:88,flexShrink:0}}>
                    <div style={{fontSize:11,color:'var(--t3)',fontWeight:500}}>{s.t}</div>
                    <div style={{fontSize:9,color:'rgba(255,255,255,.22)',marginTop:1}}>{s.dur}</div>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                      <span style={{fontSize:13,fontWeight:isBreak?400:600,color:isBreak?'var(--t3)':'rgba(255,255,255,.9)',textDecoration:isDone?'line-through':'none',opacity:isDone?.6:1}}>{s.title}</span>
                      {!isBreak&&<CPill cat={s.cat}/>}
                    </div>
                    {s.who&&<div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>👤 {s.who}</div>}
                    {isOpen&&s.info&&<div className="sess-detail">{s.info}</div>}
                  </div>
                  {!isBreak&&<span style={{color:'rgba(255,255,255,.2)',fontSize:12,transition:'transform .2s',transform:isOpen?'rotate(90deg)':'none',flexShrink:0}}>›</span>}
                </div>
              );
            })}
          </div>
        ))}
      </div>
      </>)}
    </div>
  );
}

          <button onClick={onClose} style={{background:'rgba(255,255,255,.08)',border:'none',color:'#fff',width:28,height:28,borderRadius:7,cursor:'pointer',fontSize:14,flexShrink:0}}>✕</button>
        </div>
        <p style={{fontSize:12,color:'var(--t2)',lineHeight:1.6,marginBottom:16,fontStyle:'italic',paddingBottom:14,borderBottom:'1px solid var(--border)'}}>{guide.desc}</p>
        {(guide.content||[]).map((sec,si)=>(
          <div key={si} style={{marginBottom:16,padding:'14px 16px',background:'rgba(255,255,255,.04)',borderRadius:10,borderLeft:`3px solid ${c.color}55`}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:14,color:c.color,textTransform:'uppercase',letterSpacing:.5,marginBottom:8}}>{sec.title}</div>
            <ul style={{margin:0,paddingLeft:18}}>
              {sec.points.map((pt,pi)=>(
                <li key={pi} style={{fontSize:12,color:'var(--t2)',lineHeight:1.65,marginBottom:3}}>{pt}</li>
              ))}
            </ul>
          </div>
        ))}
        <div style={{display:'flex',gap:8,marginTop:18,paddingTop:14,borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-p" style={{flex:1,justifyContent:'center',fontSize:12}} onClick={download}>⬇ Download as HTML</button>
          <button className="btn btn-g" style={{flex:1,justifyContent:'center',fontSize:12}} onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   KNOWLEDGE CHECKS
══════════════════════════════════════════ */
function KnowledgeChecks({kcResults,saveResult,checked,addXP}){
  const [sel,setSel]=useState(null);
  const [picks,setPicks]=useState({});
  const [subm,setSubm]=useState({});
  const [qi,setQi]=useState(0);
  const [done,setDone]=useState(false);
  const [filter,setFilter]=useState('all');
  const [flashcard,setFlashcard]=useState(null); // kc being studied

  const open=kc=>{
    if(!isKCUnlocked(kc.topic,checked||{}))return;
    const res=kcResults[kc.topic];
    const attempts=res?res.attempts||1:0;
    if(attempts>=2)return;
    setSel(kc);setPicks({});setSubm({});setQi(0);setDone(false);
  };

  const isCorrect=(q2,a)=>{
    if(a===undefined)return false;
    if(q2.multi){
      if(!Array.isArray(a))return false;
      const got=[...a].sort((x,y)=>x-y);
      const exp=[...q2.ans].sort((x,y)=>x-y);
      return got.length===exp.length&&got.every((v,i)=>v===exp[i]);
    }
    return a===q2.ans;
  };

  if(sel){
    const q=sel.qs[qi];
    const cat=CATS[sel.cat]||CATS.onboard;
    const curPick=picks[qi];
    const isSubm=!!subm[qi];
    const ok=isSubm&&isCorrect(q,curPick);
    const score=sel.qs.filter((q2,i)=>isCorrect(q2,picks[i])).length;
    const existingRes=kcResults[sel.topic];
    const attemptNum=(existingRes?existingRes.attempts||1:0)+1;

    const submitAnswer=()=>{
      if(curPick===undefined||(Array.isArray(curPick)&&curPick.length===0))return;
      setSubm({...subm,[qi]:true});
    };
    const pickOpt=oi=>{
      if(isSubm)return;
      if(q.multi){
        const cur=Array.isArray(curPick)?curPick:[];
        const next=cur.includes(oi)?cur.filter(x=>x!==oi):[...cur,oi];
        setPicks({...picks,[qi]:next});
      }else{
        setPicks({...picks,[qi]:oi});
        setSubm({...subm,[qi]:true});
      }
    };
    const finish=()=>{
      const pct=Math.round((score/sel.qs.length)*100);
      const best=existingRes?Math.max(existingRes.pct,pct):pct;
      saveResult(sel.topic,{score,total:sel.qs.length,pct:best,at:new Date().toISOString(),attempts:attemptNum,passed:best>=(sel.passing||80)});
      setDone(true);
    };

    if(done){
      const pct=Math.round((score/sel.qs.length)*100);
      const passed=pct>=(sel.passing||80);
      const existAttempts=existingRes?existingRes.attempts||1:0;
      const canRetry=existAttempts<1;
      return(
        <div style={{maxWidth:540,margin:'0 auto'}}>
          <div className="a1 card" style={{padding:32,textAlign:'center'}}>
            <div style={{fontSize:64,marginBottom:14}}>{passed?'🏆':pct>=60?'🎉':'📚'}</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:54,color:passed?'var(--fd-green)':'var(--fd-blue)',lineHeight:1}}>{score}<span style={{fontSize:26,color:'var(--t3)'}}>/{sel.qs.length}</span></div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:22,marginTop:8}}>{passed?'Check Passed!':pct>=60?'Almost There!':'Keep Studying!'}</div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginTop:8}}>
              <span style={{color:'var(--t2)',fontSize:13}}>{pct}% correct</span>
              <span style={{color:'var(--t3)',fontSize:11}}>·</span>
              <span style={{fontSize:11,fontWeight:700,color:passed?'var(--fd-green)':'#FF6B35',padding:'2px 8px',borderRadius:5,background:passed?'rgba(132,181,0,.15)':'rgba(255,107,53,.15)'}}>
                {passed?`✓ Passed (${sel.passing||80}% threshold)`:`✗ Need ${sel.passing||80}% to pass`}
              </span>
            </div>
            <div style={{fontSize:11,color:'var(--t3)',marginTop:8}}>Attempt {attemptNum} of 2{attemptNum===2?' (final)':''}</div>
            {passed&&<div style={{marginTop:10,fontSize:12,color:'var(--fd-green)',fontWeight:600}}>🏅 Badge earned: {sel.topic} Expert</div>}
            <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:22}}>
              {canRetry&&!passed&&<button className="btn btn-g" onClick={()=>{setPicks({});setSubm({});setDone(false);setQi(0)}}>Try Again (Attempt 2)</button>}
              <button className="btn btn-p" onClick={()=>setSel(null)}>← All Checks</button>
            </div>
          </div>
        </div>
      );
    }

    const hasSubm=q.multi?(Array.isArray(curPick)&&curPick.length>0&&!isSubm):false;
    return(
      <div style={{maxWidth:600,margin:'0 auto'}}>
        <div className="a1 card" style={{padding:26}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:18}}>
            <div>
              <div className="eyebrow">Knowledge Check · Attempt {attemptNum} of 2</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:22}}>{sel.icon} {sel.topic}</div>
              <div style={{fontSize:11,color:'var(--t3)',marginTop:3}}>Trainer: {sel.trainer} · Pass: {sel.passing||80}%</div>
            </div>
            <button className="btn btn-g btn-sm" onClick={()=>setSel(null)}>← All Checks</button>
          </div>
          <div style={{marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--t3)',marginBottom:6}}>
              <span>Question {qi+1} of {sel.qs.length}</span>
              <span style={{color:cat.color,fontWeight:700}}>{Math.round((qi/sel.qs.length)*100)}%</span>
            </div>
            <PBar pct={(qi/sel.qs.length)*100} color={cat.color}/>
          </div>
          {q.multi&&<div style={{fontSize:10,color:'var(--fd-blue)',fontWeight:700,marginBottom:8,padding:'4px 10px',background:'rgba(20,147,255,.1)',borderRadius:6,display:'inline-block'}}>SELECT ALL THAT APPLY</div>}
          <div style={{background:'rgba(255,255,255,.04)',borderRadius:10,padding:18,marginBottom:16,fontSize:15,fontWeight:700,lineHeight:1.55}}>{q.q}</div>
          <div style={{display:'flex',flexDirection:'column',gap:9,marginBottom:16}}>
            {q.opts.map((opt,oi)=>{
              let cls='q-opt';
              const isSelected=q.multi?(Array.isArray(curPick)&&curPick.includes(oi)):curPick===oi;
              if(isSubm){
                const correctOpts=q.multi?q.ans:[q.ans];
                const isAns=correctOpts.includes(oi);
                if(isAns)cls+=' correct';
                else if(isSelected)cls+=' wrong';
              }else if(isSelected)cls+=' selected';
              return(
                <div key={oi} className={cls} onClick={()=>pickOpt(oi)}>
                  {q.multi?(
                    <span style={{width:16,height:16,borderRadius:4,border:`2px solid ${isSubm?(q.ans.includes(oi)?'var(--fd-green)':isSelected?'#FF3B30':'rgba(255,255,255,.2)'):(isSelected?'var(--fd-blue)':'rgba(255,255,255,.2)')}`,background:isSelected?(isSubm?'':`rgba(20,147,255,.2)`):'transparent',display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:10,marginRight:10,transition:'all .15s'}}>{isSelected&&'✓'}</span>
                  ):(
                    <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:12,color:'var(--t3)',marginRight:10}}>{String.fromCharCode(65+oi)}.</span>
                  )}
                  {opt}
                </div>
              );
            })}
          </div>
          {q.multi&&!isSubm&&(
            <button className="btn btn-p" style={{marginBottom:14,opacity:Array.isArray(curPick)&&curPick.length>0?1:.45}} onClick={submitAnswer}>Submit Answer</button>
          )}
          {isSubm&&(
            <div style={{background:ok?'rgba(132,181,0,.1)':'rgba(255,59,48,.1)',border:`1px solid ${ok?'var(--fd-green)':'#FF3B30'}`,borderRadius:9,padding:13,marginBottom:14}}>
              <div style={{fontWeight:700,color:ok?'var(--fd-green)':'#FF3B30',marginBottom:3}}>{ok?'✅ Correct!':'❌ Not quite'}</div>
              <div style={{fontSize:13,color:'var(--t2)',lineHeight:1.65}}>{q.exp}</div>
            </div>
          )}
          {isSubm&&(
            <div style={{display:'flex',justifyContent:'flex-end'}}>
              {qi<sel.qs.length-1
                ?<button className="btn btn-p" onClick={()=>setQi(qi+1)}>Next →</button>
                :<button className="btn btn-p" onClick={finish}>See Results 🎉</button>
              }
            </div>
          )}
        </div>
      </div>
    );
  }

  const cats=['all','sports','systems','payments','platform','comply','onboard','casino'];
  const filtered=filter==='all'?KNOWLEDGE_CHECKS:KNOWLEDGE_CHECKS.filter(k=>k.cat===filter);

  return(
    <>
    {flashcard&&<FlashcardModal kc={flashcard} onClose={()=>setFlashcard(null)} onStartCheck={()=>{setFlashcard(null);open(flashcard)}}/>}
    <div className="a1" style={{maxWidth:900}}>
      <div style={{marginBottom:18}}>
        <div className="eyebrow">Test Your Understanding</div>
        <div className="page-title">Knowledge Checks</div>
        <p style={{color:'var(--t2)',fontSize:12,marginTop:4}}>160 questions across 16 topics. 80% to pass · 2 attempts · Highest score recorded.</p>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
        {cats.map(c=>{
          const cat=CATS[c]||{label:c.charAt(0).toUpperCase()+c.slice(1),color:'var(--fd-blue)',bg:'rgba(20,147,255,.08)'};
          const label=c==='all'?'All Topics':cat.label;
          return(
            <button key={c} onClick={()=>setFilter(c)} style={{padding:'4px 12px',borderRadius:20,border:`1px solid ${filter===c?cat.color:'rgba(255,255,255,.12)'}`,background:filter===c?cat.bg:'transparent',color:filter===c?cat.color:'var(--t3)',fontSize:11,fontWeight:700,cursor:'pointer',transition:'all .15s'}}>
              {label}
            </button>
          );
        })}
      </div>
      <div className="a2" style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
        {filtered.map((kc,i)=>{
          const cat=CATS[kc.cat]||CATS.onboard;
          const res=kcResults[kc.topic];
          const attempts=res?res.attempts||1:0;
          const maxed=attempts>=2;
          const passed=res&&res.passed;
          const unlocked=isKCUnlocked(kc.topic,checked||{});
          const isLocked=!unlocked;
          const clickable=unlocked&&!maxed;
          return(
            <div key={i} className={`card${clickable?' card-lift':''}`}
              style={{padding:20,cursor:clickable?'pointer':'default',border:`1px solid ${isLocked?'rgba(255,255,255,.06)':cat.color+'22'}`,opacity:isLocked?.55:1}}
              onClick={()=>clickable&&open(kc)}>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
                <div style={{width:48,height:48,borderRadius:12,background:isLocked?'rgba(255,255,255,.04)':cat.bg,border:`1px solid ${isLocked?'rgba(255,255,255,.1)':cat.color+'33'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,flexShrink:0}}>{isLocked?'🔒':kc.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:17,lineHeight:1.2}}>{kc.topic}</div>
                  <div style={{fontSize:10,color:'var(--t3)',marginTop:2}}>{kc.qs.length} questions · Trainer: {kc.trainer}</div>
                </div>
                {res&&!isLocked?(
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:26,color:passed?'var(--fd-green)':'#FF6B35',lineHeight:1}}>{res.pct}<span style={{fontSize:12}}>%</span></div>
                    <div style={{fontSize:8,fontWeight:700,color:passed?'var(--fd-green)':'#FF6B35'}}>{passed?'PASSED':'FAILED'}</div>
                  </div>
                ):(
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:20,color:'var(--t3)',flexShrink:0}}>—</div>
                )}
              </div>
              {isLocked?(
                <div style={{background:'rgba(255,255,255,.04)',borderRadius:8,padding:'10px 12px',fontSize:11,color:'var(--t3)',lineHeight:1.5,marginBottom:10,border:'1px solid rgba(255,255,255,.07)'}}>
                  🔒 Complete the <span style={{color:'var(--fd-yellow)',fontWeight:700}}>{kc.topic}</span> training session on your schedule to unlock this check.
                </div>
              ):(
                <div style={{marginBottom:10}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'var(--t3)',marginBottom:4}}>
                    <span>{res?`Best: ${res.pct}% · ${attempts}/2 attempts`:'Not attempted'}</span>
                    <span style={{color:cat.color}}>{kc.passing||80}% to pass</span>
                  </div>
                  <PBar pct={res?res.pct:0} color={passed?'var(--fd-green)':cat.color} h={3}/>
                </div>
              )}
              {!isLocked&&!maxed&&(
                <button className="btn btn-g btn-sm" style={{width:'100%',justifyContent:'center',marginBottom:7,fontSize:11}} onClick={e=>{e.stopPropagation();setFlashcard(kc)}}>
                  📖 Quick Review (3–4 slides)
                </button>
              )}
              <button className={`btn ${(maxed||isLocked)?'btn-g':'btn-p'}`} style={{width:'100%',justifyContent:'center',fontSize:11,opacity:(maxed||isLocked)?.6:1}} disabled={maxed||isLocked}>
                {isLocked?'🔒 Locked — Complete Session First':maxed?'✓ Max Attempts Reached':res?'🔄 Retake (Attempt 2)':'🚀 Start Check'}
              </button>
            </div>
          );
        })}
      </div>
      <div className="a3" style={{marginTop:16,padding:14,background:'rgba(20,147,255,.06)',border:'1px solid rgba(20,147,255,.15)',borderRadius:12,fontSize:11,color:'var(--t2)',lineHeight:1.6}}>
        <strong style={{color:'var(--fd-blue)'}}>How it works:</strong> Hit <strong>Quick Review</strong> to run through 3–4 key concept slides before your attempt — no questions, just the stuff that matters. You have 2 attempts, highest score recorded, 80% to pass. Earn <strong style={{color:'var(--fd-yellow)'}}>+100–150 XP</strong> for passing!
      </div>
    </div>
    </>
  );
}

/* ══════════════════════════════════════════
   PROFILE

function Profile({profile,checked,kcResults,onSignOut,onUpdate}){
  const [editing,setEditing]=useState(false);
  const [form,setForm]=useState({...profile});
  const total=WEEKS.reduce((a,w)=>a+w.days.reduce((b,d)=>b+d.sessions.filter(s=>s.cat!=='break').length,0),0);
  const done=Object.keys(checked).length;
  const pct=Math.round((done/total)*100);
  const d=daysSince(profile?.startDate)||0;
  const kcDone=Object.keys(kcResults).length;

          <div className="card" style={{padding:20}}>
            <div className="eyebrow" style={{marginBottom:12}}>Data & Account</div>
            <p style={{fontSize:11,color:'var(--t3)',marginBottom:14,lineHeight:1.6}}>Your progress is stored locally in your browser. For cloud sync across devices, your organization can connect a backend (Supabase or Firebase).</p>
            <button className="btn btn-g" style={{width:'100%',justifyContent:'center',fontSize:12,marginBottom:8}} onClick={()=>{if(confirm('This will clear all your saved progress. Are you sure?')){localStorage.clear();window.location.reload()}}}>

            <button className="btn btn-g" style={{width:'100%',justifyContent:'center',fontSize:12,color:'rgba(255,80,80,.8)',borderColor:'rgba(255,80,80,.2)'}} onClick={onSignOut}>
              Sign Out
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

   STUDY REVIEW MODE  (3-4 slides per topic)
══════════════════════════════════════════ */
const GUIDE_MAP={
  'Sports':'Sports',
  'Betting':'Betting',
  'AdminWeb':'AdminWeb',
  'ACE (Salesforce)':'ACE (Salesforce)',
  'ACE / Salesforce':'ACE (Salesforce)',
  'Ti2 / OpenBet':'Ti2 / OpenBet',
  'Responsible Gaming':'Responsible Gaming',
  'GeoComply':'GeoComply',
  'Detect & Prevent':'Detect & Prevent (KYC)',
  'Verification':'Detect & Prevent (KYC)',
  'Casino Overview':'Casino Overview',
  'CPP / Promotions':'CPP / Promotions',
  'CPP / Promotions Tier 1':'CPP / Promotions',
  'CPP Tier 2 / Promotions 2.0':'CPP Tier 2 / Promotions 2.0',
  'CX Recovery':'CX Recovery',
  'Soft Skills':'Soft Skills',
  'Quality Assurance':'ACE (Salesforce)',
  'VIP':'CPP / Promotions',
  'Tier 2 Sports & Betting':'Betting',
  'Pay for Performance':'Pay for Performance',
  'Payments':'Payments',
};
function getReviewSlides(topic){
  const name=GUIDE_MAP[topic]||topic;
  const guide=QUICK_GUIDES.find(g=>g.name===name);
  return guide?guide.content.slice(0,4):[];
}

function FlashcardModal({kc,onClose,onStartCheck}){
  const [idx,setIdx]=useState(0);
  const cat=CATS[kc.cat]||CATS.onboard;
  const slides=getReviewSlides(kc.topic);
  const total=slides.length;
  const slide=slides[idx];
  const isLast=idx===total-1;
  const isFirst=idx===0;

  if(!slide) return(
    <div className="modal-bg" onClick={onClose}>
      <div style={{background:'var(--navy2)',border:'1px solid rgba(20,147,255,.25)',borderRadius:20,padding:32,maxWidth:480,width:'100%',textAlign:'center'}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:36,marginBottom:12}}>📖</div>
        <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>No review slides for this topic yet.</div>
        <button className="btn btn-p" style={{width:'100%',justifyContent:'center',marginTop:16}} onClick={()=>{onClose();onStartCheck()}}>Go straight to Check →</button>
      </div>
    </div>
  );

  return(
    <div className="modal-bg" onClick={onClose}>
      <div style={{background:'var(--navy2)',border:`1px solid ${cat.color}33`,borderRadius:20,padding:28,maxWidth:540,width:'100%',boxShadow:'0 40px 80px rgba(0,0,0,.7)'}} onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <div>
            <div style={{fontSize:9,fontWeight:800,letterSpacing:1.2,color:cat.color,textTransform:'uppercase',marginBottom:3}}>📖 Quick Review · {kc.topic}</div>
            <div style={{fontSize:11,color:'var(--t3)'}}>Slide {idx+1} of {total} · tap through the key concepts before your check</div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,.08)',border:'none',color:'#fff',width:28,height:28,borderRadius:7,cursor:'pointer',fontSize:14,flexShrink:0}}>✕</button>
        </div>

        {/* Slide progress bar */}
        <div style={{display:'flex',gap:5,marginBottom:22}}>
          {slides.map((_,i)=>(
            <div key={i} onClick={()=>setIdx(i)} style={{flex:1,height:5,borderRadius:3,cursor:'pointer',transition:'background .2s',
              background:i<=idx?cat.color:'rgba(255,255,255,.1)'}}/>
          ))}
        </div>

        {/* Slide content */}
        <div style={{minHeight:230,background:'rgba(255,255,255,.04)',border:`1px solid ${cat.color}22`,borderRadius:14,padding:'22px 24px',marginBottom:18,animation:'fi .2s ease'}}>
          <div style={{display:'inline-block',background:cat.bg,color:cat.color,border:`1px solid ${cat.color}33`,borderRadius:6,padding:'3px 10px',fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:.8,marginBottom:14}}>
            {cat.label} · Slide {idx+1}
          </div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:20,marginBottom:14,lineHeight:1.2,color:'#fff'}}>
            {slide.title}
          </div>
          <ul style={{margin:0,paddingLeft:18,display:'flex',flexDirection:'column',gap:8}}>
            {slide.points.map((pt,pi)=>(
              <li key={pi} style={{fontSize:13,color:'var(--t2)',lineHeight:1.6}}>
                <span style={{color:'#fff',fontWeight:600}}>{pt.split(':')[0]}{pt.includes(':')?':':''}</span>
                {pt.includes(':')?pt.slice(pt.indexOf(':')+1):''}
              </li>
            ))}
          </ul>
        </div>

        {/* Navigation */}
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="btn btn-g" style={{flex:1,justifyContent:'center',opacity:isFirst?.4:1}} disabled={isFirst} onClick={()=>setIdx(i=>i-1)}>
            ← Back
          </button>
          {isLast?(
            <button className="btn btn-p" style={{flex:2,justifyContent:'center',fontSize:13}} onClick={()=>{onClose();onStartCheck()}}>
              ✅ I'm ready — Start the Check →
            </button>
          ):(
            <button className="btn btn-p" style={{flex:2,justifyContent:'center',fontSize:13}} onClick={()=>setIdx(i=>i+1)}>
              Next →
            </button>
          )}
        </div>
        <div style={{textAlign:'center',marginTop:10,fontSize:10,color:'var(--t3)',cursor:'pointer'}} onClick={()=>{onClose();onStartCheck()}}>
          Skip review and go straight to the check
        </div>
      </div>
    </div>
  );
}

          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:20}}>📝</span>
            <div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:18}}>My Notes</div>
              <div style={{fontSize:10,color:'var(--t3)'}}>{words} word{words!==1?'s':''} · auto-saved</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,.08)',border:'none',color:'#fff',width:28,height:28,borderRadius:7,cursor:'pointer',fontSize:14}}>✕</button>
        </div>

          value={text}
          onChange={change}

          <button className="btn btn-p btn-sm" onClick={onClose}>Done</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   GLOSSARY
══════════════════════════════════════════ */
function Glossary(){
  const [q,setQ]=useState('');
  const [cat,setCat]=useState('All');
  const catOpts=['All','sports','systems','comply','payments','casino','platform','onboard'];
  const filtered=GLOSSARY.filter(g=>
    (cat==='All'||g.cat===cat)&&
    (g.term.toLowerCase().includes(q.toLowerCase())||g.def.toLowerCase().includes(q.toLowerCase()))
  );
  const letters=[...new Set(filtered.map(g=>g.term[0].toUpperCase()))].sort();
  return(
    <div className="a1" style={{maxWidth:880}}>
      <div style={{marginBottom:20}}>
        <div className="eyebrow">CXO Training Reference</div>
        <div className="page-title">Glossary</div>
        <p style={{color:'var(--t2)',fontSize:12,marginTop:4}}>{GLOSSARY.length} key terms from your training — searchable and always one click away.</p>
      </div>
      <div className="a2" style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{position:'relative',flex:1,minWidth:200}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--t3)',fontSize:13,pointerEvents:'none'}}>🔍</span>
          <input className="search-in" placeholder="Search terms or definitions…" value={q} onChange={e=>setQ(e.target.value)} autoFocus/>
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
          {catOpts.map(k=>{
            const c=CATS[k];
            const act=cat===k;
            return(
              <button key={k} onClick={()=>setCat(k)} style={{padding:'0 11px',height:32,borderRadius:7,border:`1px solid ${act?(c?.color||'var(--fd-blue)')+'55':'var(--border)'}`,background:act?(c?.bg||'var(--fd-blue-dim)'):'var(--card)',color:act?(c?.color||'var(--fd-blue)'):'var(--t3)',cursor:'pointer',fontWeight:700,fontSize:10,fontFamily:'Inter,sans-serif',transition:'all .15s'}}>
                {k==='All'?'All Terms':c?.label}
              </button>
            );
          })}
        </div>
      </div>
      {filtered.length===0?(
        <div style={{textAlign:'center',padding:60,color:'var(--t3)'}}>
          <div style={{fontSize:36,marginBottom:10}}>🔍</div>
          <div style={{fontWeight:700,fontSize:15}}>No terms found</div>
          <div style={{fontSize:12,marginTop:4}}>Try a different search or clear the filter</div>
        </div>
      ):(
        letters.map(letter=>{
          const terms=filtered.filter(g=>g.term[0].toUpperCase()===letter);
          return(
            <div key={letter} className="a3" style={{marginBottom:20}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:22,color:'var(--fd-blue)',marginBottom:10,paddingBottom:6,borderBottom:'1px solid rgba(20,147,255,.2)'}}>{letter}</div>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {terms.map((g,i)=>{
                  const c=CATS[g.cat]||CATS.onboard;
                  return(
                    <div key={i} style={{display:'flex',gap:14,padding:'12px 16px',background:'rgba(255,255,255,.04)',borderRadius:10,border:'1px solid rgba(255,255,255,.06)',alignItems:'flex-start'}}>
                      <div style={{flexShrink:0,marginTop:2}}>
                        <span style={{background:c.bg,color:c.color,borderRadius:5,padding:'2px 7px',fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:.5}}>{c.label}</span>
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:800,fontSize:13,marginBottom:3,color:'#fff'}}>{g.term}</div>
                        <div style={{fontSize:12,color:'var(--t2)',lineHeight:1.6}}>{g.def}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

        {items.map((n,i)=>(
          <div key={i} style={{display:'flex',gap:12,padding:'12px 14px',background:'rgba(255,255,255,.04)',borderRadius:9,borderLeft:`3px solid ${n.color}`,marginBottom:8}}>

            <div><div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{n.title}</div><div style={{fontSize:12,color:'var(--t2)',lineHeight:1.5}}>{n.body}</div><div style={{fontSize:10,color:'var(--t3)',marginTop:5}}>{n.time}</div></div>

/* ══════════════════════════════════════════
   COMPANY TRAINING
══════════════════════════════════════════ */
const COMPANY_TRAININGS=[
  {id:'abc26',  group:'Legal & Ethics',   label:'Anti-Bribery and Corruption 2026'},
  {id:'aml2526',group:'Legal & Ethics',   label:'Anti-Money Laundering 2025–2026'},
  {id:'coc26',  group:'Legal & Ethics',   label:'Code of Conduct Acknowledgment 2026'},
  {id:'coc26b', group:'Legal & Ethics',   label:'Code of Conduct 2026'},
  {id:'coi26',  group:'Legal & Ethics',   label:'Conflicts of Interest Training 2026'},
  {id:'clp',    group:'Security & Privacy',label:'Communication & Legal Privilege Best Practices'},
  {id:'cyber26',group:'Security & Privacy',label:'Cybersecurity Awareness 2026'},
  {id:'priv26', group:'Security & Privacy',label:'Data Privacy 2026'},
  {id:'mdm',    group:'Security & Privacy',label:'Mobile Device Management and Conditional Access Program'},
  {id:'phish',  group:'Security & Privacy',label:'Using the Phish Alert Button'},
  {id:'incl26', group:'Workplace',         label:'Creating Inclusive Workplaces 2026'},
  {id:'play2526',group:'Workplace',        label:'Employee Play 2025–2026'},
  {id:'hprev26',group:'Workplace',         label:'Harassment Prevention 2026'},
  {id:'wv26',   group:'Workplace',         label:'Workplace Violence Awareness, Prevention, and Response 2026'},
  {id:'remote', group:'Workplace',         label:'Remote Working Policy (US Only)'},
  {id:'rg26',   group:'Responsible Gaming',label:'Responsible Gaming 2026'},
];
const COMPANY_GROUPS=['Legal & Ethics','Security & Privacy','Workplace','Responsible Gaming'];
const GROUP_COLORS={
  'Legal & Ethics':    {bg:'rgba(20,147,255,.08)',  border:'rgba(20,147,255,.2)',  head:'var(--fd-blue)',  dot:'#1493FF'},
  'Security & Privacy':{bg:'rgba(255,184,0,.06)',   border:'rgba(255,184,0,.18)',  head:'var(--fd-yellow)',dot:'#FFB800'},
  'Workplace':         {bg:'rgba(16,185,129,.07)',  border:'rgba(16,185,129,.2)', head:'#10B981',        dot:'#10B981'},
  'Responsible Gaming':{bg:'rgba(132,181,0,.07)',   border:'rgba(132,181,0,.2)',  head:'#84B500',        dot:'#84B500'},
};

const LS_COMPANY='fd_company_training';
function loadCompanyTraining(){try{return JSON.parse(localStorage.getItem(LS_COMPANY))||{};}catch{return{};}}
function saveCompanyTraining(d){localStorage.setItem(LS_COMPANY,JSON.stringify(d));}

function CompanyTraining(){
  const [done,setDone]=useState(()=>loadCompanyTraining());
  const total=COMPANY_TRAININGS.length;
  const completedCount=Object.values(done).filter(Boolean).length;
  const pct=Math.round((completedCount/total)*100);

  const toggle=id=>{
    setDone(prev=>{const n={...prev,[id]:!prev[id]};saveCompanyTraining(n);return n;});
  };

  const allDone=completedCount===total;

  return(
    <div style={{maxWidth:720,margin:'0 auto',padding:'28px 24px 80px'}}>
      {/* Header */}
      <div style={{marginBottom:28}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:28,letterSpacing:1,color:'#fff',marginBottom:4}}>
          COMPANY TRAINING CAMP
        </div>
        <div style={{fontSize:12,color:'rgba(255,255,255,.4)',marginBottom:18,lineHeight:1.6}}>
          Complete these trainings on the internal Client compliance portal. Check them off here as you go to track your progress.
        </div>

        {/* Progress bar */}
        <div style={{background:'rgba(255,255,255,.06)',borderRadius:14,padding:'16px 20px',border:'1px solid rgba(255,255,255,.08)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:15,color:allDone?'#84B500':'rgba(255,255,255,.75)',letterSpacing:.5}}>
              {allDone?'🏆 ALL TRAININGS COMPLETE!':`${completedCount} of ${total} Complete`}
            </div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:22,color:allDone?'#84B500':'var(--fd-blue)'}}>{pct}%</div>
          </div>
          <div style={{height:8,background:'rgba(255,255,255,.08)',borderRadius:8,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${pct}%`,background:allDone?'linear-gradient(90deg,#84B500,#A8D600)':'linear-gradient(90deg,var(--fd-blue),#4BB8FF)',borderRadius:8,transition:'width .4s ease'}}/>
          </div>
          <div style={{display:'flex',gap:16,marginTop:10,flexWrap:'wrap'}}>
            {COMPANY_GROUPS.map(g=>{
              const items=COMPANY_TRAININGS.filter(t=>t.group===g);
              const gc=items.filter(t=>done[t.id]).length;
              const col=GROUP_COLORS[g];
              return(
                <div key={g} style={{display:'flex',alignItems:'center',gap:5,fontSize:10}}>
                  <div style={{width:7,height:7,borderRadius:'50%',background:col.dot}}/>
                  <span style={{color:'rgba(255,255,255,.45)'}}>{g}:</span>
                  <span style={{color:gc===items.length?col.dot:'rgba(255,255,255,.6)',fontWeight:700}}>{gc}/{items.length}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Groups */}
      {COMPANY_GROUPS.map(group=>{
        const items=COMPANY_TRAININGS.filter(t=>t.group===group);
        const gc=items.filter(t=>done[t.id]).length;
        const col=GROUP_COLORS[group];
        const groupDone=gc===items.length;
        return(
          <div key={group} style={{background:col.bg,border:`1px solid ${col.border}`,borderRadius:14,padding:'18px 20px',marginBottom:14}}>
            {/* Group header */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:14,color:col.head,letterSpacing:.8}}>
                {groupDone?'✓ ':''}{group.toUpperCase()}
              </div>
              <div style={{fontSize:11,color:groupDone?col.head:'rgba(255,255,255,.35)',fontWeight:700}}>
                {gc}/{items.length}
              </div>
            </div>
            {/* Items */}
            <div style={{display:'flex',flexDirection:'column',gap:0}}>
              {items.map((item,idx)=>{
                const isChecked=!!done[item.id];
                return(
                  <div key={item.id} onClick={()=>toggle(item.id)} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:idx<items.length-1?'1px solid rgba(255,255,255,.05)':'none',cursor:'pointer',borderRadius:8,transition:'background .15s'}}
                    onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.04)'}
                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    {/* Checkbox */}
                    <div style={{width:20,height:20,borderRadius:6,border:`2px solid ${isChecked?col.dot:'rgba(255,255,255,.2)'}`,background:isChecked?col.dot:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .15s'}}>
                      {isChecked&&<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4L4.5 7.5L10 1" stroke="#0A1428" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                    </div>
                    {/* Label */}
                    <div style={{flex:1,fontSize:13,fontWeight:isChecked?500:600,color:isChecked?'rgba(255,255,255,.4)':'rgba(255,255,255,.85)',textDecoration:isChecked?'line-through':'none',transition:'all .2s',lineHeight:1.4}}>
                      {item.label}
                    </div>
                    {/* Status badge */}
                    <div style={{fontSize:10,fontWeight:700,color:isChecked?col.dot:'rgba(255,255,255,.25)',padding:'3px 8px',background:isChecked?col.dot+'18':'rgba(255,255,255,.04)',border:'1px solid '+(isChecked?col.dot+'40':'rgba(255,255,255,.08)'),borderRadius:20,whiteSpace:'nowrap',transition:'all .2s'}}>
                      {isChecked?'✓ Done':'Pending'}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {/* Footer note */}
      <div style={{textAlign:'center',fontSize:11,color:'rgba(255,255,255,.2)',marginTop:20,lineHeight:1.7}}>
        These trainings are completed on the Client internal compliance portal. Use this checklist to track your progress.<br/>
        Checkmarks save automatically to your browser.
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════ */
function App(){
  const [profile,setProfile]=useState(()=>loadProfile());
  const [checked,setChecked]=useState(()=>loadChecked());
  const [kcResults,setKcResults]=useState(()=>loadKC());
  const [xp,setXp]=useState(()=>loadXP());
  const [view,setView]=useState('dashboard');
  const [notif,setNotif]=useState(false);
  const [notesOpen,setNotesOpen]=useState(false);
  const [xpToast,setXpToast]=useState(null);
  const [pinModal,setPinModal]=useState(false);
  const [coordMode,setCoordMode]=useState(false);

  const addXP=(amount,label)=>{
    setXp(prev=>{const n=prev+amount;saveXP(n);return n});
    setXpToast({amount,label});
    setTimeout(()=>setXpToast(null),2500);
  };

  const onToggle=key=>{
    setChecked(prev=>{
      const n={...prev};
      const wasOn=!!n[key];
      if(wasOn) delete n[key];
      else { n[key]=true; addXP(XP_AWARDS.session.xp,XP_AWARDS.session.label); }
      saveChecked(n);
      return n;
    });
  };

  const saveResult=(topic,res)=>{
    const award=res.passed?(res.attempts===1?XP_AWARDS.kcPassFirst:XP_AWARDS.kcPass):XP_AWARDS.kcFail;
    addXP(award.xp,award.label);
    setKcResults(prev=>{const n={...prev,[topic]:res};saveKC(n);return n});
  };

  const onSignOut=()=>{setProfile(null)};
  const onUpdate=p=>{setProfile(p)};

  // Keyboard shortcuts
  useEffect(()=>{
    const ids=['dashboard','schedule','library','checks','company','glossary','class','profile'];
    const h=e=>{const i=parseInt(e.key)-1;if(!isNaN(i)&&ids[i]&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'&&document.activeElement.tagName!=='TEXTAREA')setView(ids[i])};
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[]);

  if(!profile){return(
    <>
      <Onboarding onComplete={p=>{setProfile(p)}} onCoordClick={()=>setPinModal(true)}/>
      {pinModal&&!coordMode&&<PINModal onSuccess={()=>{setPinModal(false);setCoordMode(true);}} onCancel={()=>setPinModal(false)}/>}
      {coordMode&&<CoordinatorPanel onExit={()=>setCoordMode(false)}/>}
      {/* Bottom bar: coordinator + previous wave access */}
      <div style={{position:'fixed',bottom:0,left:0,right:0,height:28,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 16px',background:'rgba(0,0,0,.5)',zIndex:500,borderTop:'1px solid rgba(255,255,255,.06)'}}>
        <WaveSwitcher/>
        <div onClick={()=>setPinModal(true)} style={{fontSize:9,color:'rgba(255,255,255,.18)',cursor:'pointer',userSelect:'none',letterSpacing:.5}} title="Coordinator access">⚙ Coordinator</div>
      </div>
    </>
  );}

  const VIEWS={
    dashboard:<Dashboard profile={profile} checked={checked} onToggle={onToggle} setView={setView} kcResults={kcResults} xp={xp} onCoordClick={()=>setPinModal(true)}/>,
    schedule:<Schedule checked={checked} onToggle={onToggle} profile={profile}/>,
    library:<Library/>,
    checks:<KnowledgeChecks kcResults={kcResults} saveResult={saveResult} checked={checked} addXP={addXP}/>,
    company:<CompanyTraining/>,
    glossary:<Glossary/>,
    class:<ClassRoom/>,
    profile:<Profile profile={profile} checked={checked} kcResults={kcResults} onSignOut={onSignOut} onUpdate={onUpdate} xp={xp}/>,
  };

  const lv=getLevel(xp);

  return(
    <>
      <div className="amb"><div className="ab ab1"/><div className="ab ab2"/><div className="ab ab3"/></div>
      <div className="scn"/>
      <TopBar profile={profile} onNotif={()=>setNotif(true)} onProfile={()=>setView('profile')} onCoordClick={()=>setPinModal(true)}/>
      <Sidebar active={view} set={setView}/>
      <main className="main" key={view}>{VIEWS[view]}</main>
      <StatusBar profile={profile} checked={checked}/>

      {/* PIN Modal */}
      {pinModal&&!coordMode&&(
        <PINModal
          onSuccess={()=>{setPinModal(false);setCoordMode(true);}}
          onCancel={()=>setPinModal(false)}
        />
      )}

      {/* Coordinator Panel */}
      {coordMode&&(
        <CoordinatorPanel onExit={()=>setCoordMode(false)}/>
      )}

      {/* Floating Notes button */}
      <button onClick={()=>setNotesOpen(true)} title="My Notes" style={{position:'fixed',bottom:72,right:20,width:46,height:46,borderRadius:13,background:'rgba(255,184,0,.15)',border:'1px solid rgba(255,184,0,.35)',cursor:'pointer',fontSize:20,display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,boxShadow:'0 4px 16px rgba(0,0,0,.4)',transition:'all .2s'}}
        onMouseEnter={e=>e.currentTarget.style.background='rgba(255,184,0,.25)'}
        onMouseLeave={e=>e.currentTarget.style.background='rgba(255,184,0,.15)'}>
        📝
      </button>

      {/* XP Toast */}
      {xpToast&&(
        <div style={{position:'fixed',bottom:130,right:20,background:'rgba(10,20,40,.95)',border:`1px solid ${lv.color}`,borderRadius:12,padding:'10px 16px',zIndex:600,animation:'fi .3s ease',boxShadow:`0 8px 24px rgba(0,0,0,.5),0 0 20px ${lv.color}33`}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:20,color:lv.color}}>{xpToast.amount>0?'+':''}{xpToast.amount} XP</div>
          <div style={{fontSize:10,color:'var(--t2)',marginTop:1}}>{xpToast.label}</div>
        </div>
      )}

      {notesOpen&&<NotesModal onClose={()=>setNotesOpen(false)}/>}
      {notif&&<NotifModal close={()=>setNotif(false)} profile={profile}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
